<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ProTactics Studio 3D PRO - TootScouting</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Inter:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  html, body { width: 100%; height: 100vh; margin: 0; padding: 0; font-family: "Cairo", "Inter", sans-serif; background: #0b0f19; color: #e2e8f0; overflow: hidden; user-select: none; }
  .font-en { font-family: "Inter", sans-serif; }
  .tool-btn.active { background: #2563eb; color: #fff; border-color: #60a5fa; }
  .toggle-pill.active { background: #1e293b; border-color: #38bdf8; color: #38bdf8; }
  .frame-btn.active { background: #10b981; color: #fff; border-color: #34d399; }
  .stroke-btn.active { background: #334155; border-color: #facc15; color: #facc15; }
  canvas { touch-action: none; display: block; margin: 0 auto; cursor: crosshair; }
  input[type="color"] { -webkit-appearance: none; border: none; padding: 0; }
  input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
  input[type="color"]::-webkit-color-swatch { border: 1px solid rgba(255,255,255,0.35); border-radius: 4px; }
</style>
</head>
<body class="w-full h-screen flex flex-col bg-[#0b0f19] overflow-hidden">

<!-- شاشة تسجيل الدخول وإنشاء الحساب (Supabase Auth) -->
<div id="auth-overlay" class="fixed inset-0 z-[100] bg-[#070b14]/95 backdrop-blur-md flex items-center justify-center p-4">
  <div class="bg-[#111827] border border-slate-700/80 rounded-2xl w-full max-w-sm p-6 shadow-2xl text-center space-y-4">
    <div class="space-y-1">
      <div class="w-12 h-12 mx-auto rounded-xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-2xl">⚽</div>
      <h2 class="text-lg font-extrabold text-white tracking-wide">ProTactics <span class="text-amber-400">3D PRO</span></h2>
      <p class="text-xs text-slate-400">منصة التحليل التكتيكي • TootScouting</p>
    </div>

    <div class="grid grid-cols-2 bg-slate-950 p-1 rounded-xl border border-slate-800 text-xs font-bold">
      <button type="button" id="tab-login" onclick="switchAuthMode('login')" class="bg-amber-500 text-slate-950 py-1.5 rounded-lg transition">تسجيل الدخول</button>
      <button type="button" id="tab-signup" onclick="switchAuthMode('signup')" class="text-slate-400 hover:text-white py-1.5 rounded-lg transition">حساب جديد</button>
    </div>

    <form onsubmit="handleSupabaseAuth(event)" class="space-y-3 text-right">
      <div id="name-field" class="hidden">
        <label class="block text-[11px] font-semibold text-slate-300 mb-1">الاسم الكامل / النادي</label>
        <input type="text" id="auth-name" placeholder="مثال: كابتن محمود" class="w-full bg-slate-950 border border-slate-700 focus:border-amber-400 rounded-xl px-3 py-2 text-xs text-white outline-none">
      </div>
      <div>
        <label class="block text-[11px] font-semibold text-slate-300 mb-1">البريد الإلكتروني</label>
        <input type="email" id="auth-email" required placeholder="coach@club.com" class="w-full bg-slate-950 border border-slate-700 focus:border-amber-400 rounded-xl px-3 py-2 text-xs text-white outline-none font-en text-left" dir="ltr">
      </div>
      <div>
        <label class="block text-[11px] font-semibold text-slate-300 mb-1">كلمة المرور (6 أحرف على الأقل)</label>
        <input type="password" id="auth-pass" required minlength="6" placeholder="••••••••" class="w-full bg-slate-950 border border-slate-700 focus:border-amber-400 rounded-xl px-3 py-2 text-xs text-white outline-none font-en text-left" dir="ltr">
      </div>

      <div id="auth-msg" class="hidden text-[11px] rounded-lg px-2.5 py-1.5 text-center"></div>

      <button type="submit" id="auth-submit-btn" class="w-full bg-gradient-to-l from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-extrabold text-xs py-2.5 rounded-xl shadow-lg transition">
        دخول إلى غرفة التحليل 🔓
      </button>
    </form>
  </div>
</div>

<!-- الشريط العلوي -->
<header class="bg-[#111827] border-b border-slate-800 px-3 py-1.5 flex flex-wrap items-center justify-between gap-1.5 shrink-0">
  <div class="flex items-center gap-2">
    <span class="text-sm font-extrabold text-white">⚽ ProTactics <span class="text-[10px] text-amber-300 bg-amber-950 border border-amber-700 px-1.5 py-0.5 rounded-full">3D PRO</span></span>
    <button onclick="openLineupModal()" class="bg-blue-600 hover:bg-blue-500 text-white text-[11px] px-2.5 py-1 rounded-lg font-bold"><i class="fa-solid fa-users-gear"></i> الأسماء والتشكيلات</button>
  </div>

  <div class="flex flex-wrap items-center gap-1">
    <select onchange="loadSetPiece(this.value);this.value='';" class="bg-slate-900 border border-slate-700 text-amber-300 text-[11px] px-2 py-1 rounded-lg font-semibold">
      <option value="">⚡ قوالب جاهزة</option>
      <option value="corner_att">ركنية هجومية</option>
      <option value="fk_direct">ركلة حرة وحائط صد</option>
      <option value="gk_buildup">بناء لعب من المرمى</option>
      <option value="high_press">ضغط عالي</option>
      <option value="counter_att">تحول هجومي سريع</option>
      <option value="rondo_drill">تدريب رندو</option>
    </select>

    <div class="flex bg-slate-900 p-0.5 rounded-lg border border-slate-800">
      <button onclick="setPitchMode('full')" id="btn-pitch-full" class="pitch-mode-btn bg-slate-700 text-white text-[11px] px-2 py-0.5 rounded font-semibold">ملعب كامل</button>
      <button onclick="setPitchMode('half')" id="btn-pitch-half" class="pitch-mode-btn text-slate-400 text-[11px] px-2 py-0.5 rounded font-semibold">نصف ملعب</button>
    </div>

    <button onclick="toggle3D()" id="btn-toggle-3d" class="toggle-pill bg-slate-900 text-amber-300 border border-amber-700/60 text-[11px] px-2.5 py-1 rounded-lg font-en font-bold">3D View</button>
    <button onclick="toggleZones()" id="btn-toggle-zones" class="toggle-pill bg-slate-900 text-slate-300 border border-slate-700 text-[11px] px-2 py-1 rounded-lg font-semibold">5-Zones</button>
    <button onclick="toggleOffside()" id="btn-toggle-offside" class="toggle-pill bg-slate-900 text-slate-300 border border-slate-700 text-[11px] px-2 py-1 rounded-lg font-semibold">التسلل</button>
    <button onclick="toggleCompactness()" id="btn-toggle-compact" class="toggle-pill bg-slate-900 text-slate-300 border border-slate-700 text-[11px] px-2 py-1 rounded-lg font-semibold">التماسك</button>
    <button onclick="toggleTrails()" id="btn-toggle-trails" class="toggle-pill active bg-slate-900 text-slate-300 border border-slate-700 text-[11px] px-2 py-1 rounded-lg font-semibold">مسار الحركة</button>
    <button onclick="toggleNotesPanel()" id="btn-toggle-notes" class="toggle-pill bg-slate-900 text-slate-300 border border-slate-700 text-[11px] px-2 py-1 rounded-lg font-semibold">الملاحظات</button>

    <select id="pitch-theme-select" onchange="setPitchTheme(this.value)" class="bg-slate-900 border border-slate-700 text-slate-200 text-[11px] px-1.5 py-1 rounded-lg">
      <option value="green">أخضر عشبي</option>
      <option value="classic">أخضر فاتح</option>
      <option value="navy">كحلي تكتيكي</option>
      <option value="midnight">أسود ليلي</option>
      <option value="opta">أبيض Opta</option>
    </select>
  </div>

  <div class="flex items-center gap-1">
    <span id="user-badge" class="hidden text-[10px] text-amber-300 bg-slate-800 border border-slate-700 px-2 py-1 rounded-lg font-semibold"></span>
    <button onclick="exportJSON()" title="حفظ" class="bg-slate-800 text-sky-300 border border-slate-700 text-[11px] px-2 py-1 rounded-lg"><i class="fa-solid fa-floppy-disk"></i></button>
    <label title="فتح" class="bg-slate-800 text-purple-300 border border-slate-700 text-[11px] px-2 py-1 rounded-lg cursor-pointer"><i class="fa-solid fa-folder-open"></i><input type="file" accept=".json" onchange="importJSON(event)" class="hidden"></label>
    <button onclick="undoAction()" title="تراجع" class="bg-slate-800 text-slate-200 border border-slate-700 text-[11px] px-2 py-1 rounded-lg"><i class="fa-solid fa-rotate-left"></i></button>
    <button onclick="clearDrawings()" title="مسح الخطوط" class="bg-slate-800 text-amber-300 border border-slate-700 text-[11px] px-2 py-1 rounded-lg"><i class="fa-solid fa-eraser"></i></button>
    <button onclick="resetBoard()" title="إعادة ضبط" class="bg-slate-800 text-red-400 border border-slate-700 text-[11px] px-2 py-1 rounded-lg"><i class="fa-solid fa-trash-can"></i></button>
    <button onclick="exportPNG()" class="bg-emerald-600 text-white font-bold text-[11px] px-2 py-1 rounded-lg">PNG</button>
    <button onclick="exportVideo()" id="btn-export-video" class="bg-rose-600 text-white font-bold text-[11px] px-2 py-1 rounded-lg">فيديو</button>
    <button onclick="logoutSession()" title="تسجيل الخروج" class="bg-slate-800 hover:bg-rose-950 text-slate-300 hover:text-rose-400 border border-slate-700 text-[11px] px-2 py-1 rounded-lg"><i class="fa-solid fa-right-from-bracket"></i></button>
  </div>
</header>

<div class="flex-1 flex overflow-hidden">
  <!-- الشريط الجانبي للأدوات -->
  <aside class="bg-[#111827] border-l border-slate-800 p-2 flex flex-col gap-1.5 w-52 shrink-0 overflow-y-auto">
    <div class="text-[10px] font-bold text-slate-400">أدوات الرسم والربط</div>
    <div class="grid grid-cols-2 gap-1">
      <button onclick="setTool('select')" id="tool-select" class="tool-btn active p-1.5 rounded border border-slate-700 bg-slate-800 text-[11px]">تحريك وتعديل</button>
      <button onclick="setTool('link')" id="tool-link" class="tool-btn p-1.5 rounded border border-slate-700 bg-slate-800 text-[11px] text-amber-300">🔗 ربط لاعبين</button>
      <button onclick="setTool('curved')" id="tool-curved" class="tool-btn p-1.5 rounded border border-slate-700 bg-slate-800 text-[11px] text-emerald-300">↪ سهم منحني</button>
      <button onclick="setTool('arrow')" id="tool-arrow" class="tool-btn p-1.5 rounded border border-slate-700 bg-slate-800 text-[11px]">➡ سهم مستقيم</button>
      <button onclick="setTool('pass')" id="tool-pass" class="tool-btn p-1.5 rounded border border-slate-700 bg-slate-800 text-[11px]">┄ تمرير</button>
      <button onclick="setTool('dribble')" id="tool-dribble" class="tool-btn p-1.5 rounded border border-slate-700 bg-slate-800 text-[11px] text-sky-300">〰 مراوغة</button>
      <button onclick="setTool('spotlight')" id="tool-spotlight" class="tool-btn p-1.5 rounded border border-slate-700 bg-slate-800 text-[11px] text-amber-200">✨ تمييز لاعب</button>
      <button onclick="setTool('shadow')" id="tool-shadow" class="tool-btn p-1.5 rounded border border-slate-700 bg-slate-800 text-[11px] text-rose-300">ظل دفاعي</button>
      <button onclick="setTool('vision')" id="tool-vision" class="tool-btn p-1.5 rounded border border-slate-700 bg-slate-800 text-[11px] text-cyan-300">مخروط رؤية</button>
      <button onclick="setTool('polygon')" id="tool-polygon" class="tool-btn p-1.5 rounded border border-slate-700 bg-slate-800 text-[11px]">تظليل مساحة</button>
      <button onclick="setTool('ruler')" id="tool-ruler" class="tool-btn p-1.5 rounded border border-slate-700 bg-slate-800 text-[11px]">قياس متر</button>
      <button onclick="setTool('text')" id="tool-text" class="tool-btn p-1.5 rounded border border-slate-700 bg-slate-800 text-[11px]">نص شرح</button>
    </div>

    <div class="flex flex-col gap-1 bg-slate-900 p-1.5 rounded border border-slate-800">
      <div class="flex items-center justify-around">
        <button onclick="setColor('#facc15')" data-color="#facc15" class="color-btn w-4 h-4 rounded-full bg-yellow-400 ring-2 ring-white"></button>
        <button onclick="setColor('#ffffff')" data-color="#ffffff" class="color-btn w-4 h-4 rounded-full bg-white"></button>
        <button onclick="setColor('#ef4444')" data-color="#ef4444" class="color-btn w-4 h-4 rounded-full bg-red-500"></button>
        <button onclick="setColor('#38bdf8')" data-color="#38bdf8" class="color-btn w-4 h-4 rounded-full bg-sky-400"></button>
        <button onclick="setColor('#10b981')" data-color="#10b981" class="color-btn w-4 h-4 rounded-full bg-emerald-500"></button>
      </div>
      <div class="grid grid-cols-3 gap-1 pt-1">
        <button onclick="setStrokeWidth(2)" id="sw-2" class="stroke-btn py-0.5 rounded border border-slate-700 text-[10px]">رفيع</button>
        <button onclick="setStrokeWidth(3)" id="sw-3" class="stroke-btn active py-0.5 rounded border border-slate-700 text-[10px]">وسط</button>
        <button onclick="setStrokeWidth(5)" id="sw-5" class="stroke-btn py-0.5 rounded border border-slate-700 text-[10px]">عريض</button>
      </div>
    </div>

    <div class="text-[10px] font-bold text-slate-400 mt-1">اللاعبون وأدوات التدريب</div>
    <div class="grid grid-cols-2 gap-1">
      <button onclick="addPiece('red')" class="bg-red-950 text-red-300 border border-red-800 py-1 rounded text-[11px]">+ لاعب 1</button>
      <button onclick="addPiece('blue')" class="bg-sky-950 text-sky-300 border border-sky-800 py-1 rounded text-[11px]">+ لاعب 2</button>
      <button onclick="addPiece('ball')" class="bg-slate-800 text-slate-200 border border-slate-700 py-1 rounded text-[11px]">+ كرة</button>
      <button onclick="addPiece('cone')" class="bg-amber-950 text-amber-300 border border-amber-800 py-1 rounded text-[11px]">+ قمع</button>
      <button onclick="addPiece('mannequin')" class="bg-purple-950 text-purple-300 border border-purple-800 py-1 rounded text-[11px]">+ دمية</button>
      <button onclick="addPiece('minigoal')" class="bg-emerald-950 text-emerald-300 border border-emerald-800 py-1 rounded text-[11px]">+ مرمى صغير</button>
      <button onclick="addPiece('hurdle')" class="bg-cyan-950 text-cyan-300 border border-cyan-800 py-1 rounded text-[11px]">+ حاجز قفز</button>
      <button onclick="addPiece('ladder')" class="bg-yellow-950 text-yellow-300 border border-yellow-800 py-1 rounded text-[11px]">+ سلم سرعة</button>
    </div>
  </aside>

  <!-- منطقة الملعب -->
  <main id="canvas-container" class="flex-1 relative bg-[#080c14] flex flex-col items-center justify-between p-2 overflow-hidden">
    <div class="w-full max-w-5xl flex flex-wrap items-center justify-between bg-slate-900 border border-slate-800 rounded-lg px-3 py-1 gap-2 shrink-0">
      <div class="flex items-center gap-1.5">
        <img id="banner-red-logo" src="" class="hidden w-5 h-5 object-contain rounded">
        <input type="color" id="quick-red-primary" value="#dc2626" onchange="quickKitUpdate('red')" class="w-5 h-5 cursor-pointer bg-transparent">
        <input type="color" id="quick-red-secondary" value="#ffffff" onchange="quickKitUpdate('red')" class="w-5 h-5 cursor-pointer bg-transparent">
        <select id="quick-red-pattern" onchange="quickKitUpdate('red')" class="bg-slate-800 border border-slate-700 text-[10px] text-slate-200 px-1 py-0.5 rounded">
          <option value="solid">سادة</option><option value="striped">مقلم</option><option value="halves">نصفين</option>
        </select>
        <span id="display-red-name" class="text-xs font-bold text-white">الفريق الأول</span>
        <select id="quick-red-form" onchange="instantFormationChange('red', this.value)" class="bg-slate-800 border border-slate-700 text-amber-300 text-[11px] font-en font-bold px-1.5 py-0.5 rounded">
          <option value="5-4-1">5-4-1</option><option value="4-3-3">4-3-3</option><option value="4-2-3-1">4-2-3-1</option><option value="3-5-2">3-5-2</option><option value="3-4-3">3-4-3</option><option value="4-4-2">4-4-2</option>
        </select>
        <span id="metrics-red" class="hidden text-[10px] font-en bg-red-950 border border-red-800 text-red-200 px-2 py-0.5 rounded"></span>
      </div>

      <span class="text-[11px] font-en font-bold text-slate-500">VS</span>

      <div class="flex items-center gap-1.5">
        <span id="metrics-blue" class="hidden text-[10px] font-en bg-sky-950 border border-sky-800 text-sky-200 px-2 py-0.5 rounded"></span>
        <select id="quick-blue-form" onchange="instantFormationChange('blue', this.value)" class="bg-slate-800 border border-slate-700 text-sky-300 text-[11px] font-en font-bold px-1.5 py-0.5 rounded">
          <option value="4-3-3">4-3-3</option><option value="4-2-3-1">4-2-3-1</option><option value="5-4-1">5-4-1</option><option value="3-5-2">3-5-2</option><option value="3-4-3">3-4-3</option><option value="4-4-2">4-4-2</option>
        </select>
        <span id="display-blue-name" class="text-xs font-bold text-white">الفريق الثاني</span>
        <select id="quick-blue-pattern" onchange="quickKitUpdate('blue')" class="bg-slate-800 border border-slate-700 text-[10px] text-slate-200 px-1 py-0.5 rounded">
          <option value="solid">سادة</option><option value="striped">مقلم</option><option value="halves">نصفين</option>
        </select>
        <input type="color" id="quick-blue-primary" value="#0284c7" onchange="quickKitUpdate('blue')" class="w-5 h-5 cursor-pointer bg-transparent">
        <input type="color" id="quick-blue-secondary" value="#ffffff" onchange="quickKitUpdate('blue')" class="w-5 h-5 cursor-pointer bg-transparent">
        <img id="banner-blue-logo" src="" class="hidden w-5 h-5 object-contain rounded">
      </div>
    </div>

    <div id="pitch-wrapper" class="w-full flex-1 flex items-center justify-center overflow-hidden my-1">
      <canvas id="tactical-canvas" width="900" height="580" class="rounded-xl shadow-2xl border border-slate-800"></canvas>
    </div>

    <div class="w-full max-w-5xl bg-slate-900 border border-slate-800 rounded-xl px-3 py-1.5 flex items-center justify-between gap-2 shrink-0">
      <div class="flex items-center gap-1.5">
        <button onclick="togglePlayAnimation()" id="btn-play-anim" class="bg-emerald-600 text-white text-xs font-bold px-3 py-1 rounded-lg"><span id="play-label">▶ تشغيل</span></button>
        <button onclick="toggleLoopAnim()" id="btn-loop-anim" class="bg-slate-800 text-slate-300 border border-slate-700 text-xs px-2 py-1 rounded-lg"><i class="fa-solid fa-repeat"></i></button>
        <button onclick="addKeyframe()" class="bg-blue-600 text-white text-xs font-semibold px-2.5 py-1 rounded-lg">+ إطار جديد</button>
        <button onclick="deleteCurrentKeyframe()" class="bg-slate-800 text-red-400 border border-slate-700 text-xs px-2 py-1 rounded-lg">حذف</button>
      </div>
      <div id="frames-list" class="flex items-center gap-1 overflow-x-auto px-1"></div>
      <div class="flex items-center gap-1.5">
        <span class="text-[10px] text-slate-400">السرعة:</span>
        <select id="anim-speed" class="bg-slate-950 border border-slate-700 rounded px-1.5 py-0.5 text-xs text-white">
          <option value="1500">بطيء</option><option value="900" selected>متوسط</option><option value="450">سريع</option>
        </select>
      </div>
    </div>

    <div id="polygon-controls" class="hidden absolute bottom-16 left-1/2 -translate-x-1/2 bg-slate-900 border border-yellow-500 px-4 py-1.5 rounded-full flex items-center gap-2 z-30">
      <button onclick="finishPolygon()" class="bg-emerald-600 text-white text-xs font-bold px-3 py-1 rounded-full">إغلاق وتظليل</button>
      <button onclick="cancelPolygon()" class="bg-slate-700 text-slate-200 text-xs px-2.5 py-1 rounded-full">إلغاء</button>
    </div>
    <div id="toast-msg" class="pointer-events-none opacity-0 transition-opacity duration-300 absolute top-12 left-1/2 -translate-x-1/2 bg-slate-900 border border-slate-700 text-white text-xs px-4 py-1.5 rounded-full z-40"></div>
  </main>

  <!-- لوحة الملاحظات -->
  <aside id="notes-panel" class="hidden bg-[#111827] border-r border-slate-800 p-3 flex flex-col gap-2 w-60 shrink-0">
    <div class="flex justify-between border-b border-slate-800 pb-1">
      <span class="text-xs font-bold text-sky-400">ملاحظات الإطار</span>
      <button onclick="toggleNotesPanel()" class="text-slate-400 text-xs">✕</button>
    </div>
    <input type="text" id="frame-title-input" oninput="updateFrameNotes()" placeholder="عنوان اللقطة..." class="bg-slate-950 border border-slate-700 rounded px-2 py-1 text-xs text-white">
    <textarea id="frame-notes-input" oninput="updateFrameNotes()" placeholder="الشرح التكتيكي..." class="bg-slate-950 border border-slate-700 rounded p-2 text-xs text-slate-200 flex-1 resize-none"></textarea>
    <label class="flex items-center gap-1.5 text-[11px] text-slate-300"><input type="checkbox" id="show-note-overlay" checked onchange="render()"> عرض العنوان</label>
  </aside>
</div>

<!-- نافذة إدارة التشكيلات -->
<div id="lineup-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-3">
  <div class="bg-[#111827] border border-slate-700 rounded-2xl w-full max-w-4xl max-h-[90vh] flex flex-col">
    <div class="flex justify-between items-center border-b border-slate-800 px-4 py-3">
      <h3 class="text-sm font-bold text-white">إدارة أسماء وأرقام اللاعبين</h3>
      <button onclick="closeLineupModal()" class="text-slate-400 text-sm">✕</button>
    </div>
    <div class="p-4 overflow-y-auto grid grid-cols-1 md:grid-cols-2 gap-4">

  if(t==="corner_att"){setPitchMode("half");pieces=[{id:"r_gk",type:"red",nx:0.05,ny:0.5,number:"1",label:"GK"},{id:"r1",type:"red",nx:0.14,ny:0.36,number:"4",label:"Zonal"},{id:"r2",type:"red",nx:0.14,ny:0.46,number:"5",label:"Zonal"},{id:"b_taker",type:"blue",nx:0.02,ny:0.03,number:"10",label:"Taker",spotlight:true},{id:"b1",type:"blue",nx:0.23,ny:0.31,number:"4",label:"Near"},{id:"ball_1",type:"ball",nx:0.03,ny:0.04}];drawings.push({type:"curved",points:[{nx:0.03,ny:0.04},{nx:0.15,ny:0.44}],cp:{nx:0.14,ny:0.18},color:"#facc15",width:3});}
  else if(t==="fk_direct"){setPitchMode("half");pieces=[{id:"r_gk",type:"red",nx:0.05,ny:0.56,number:"1",label:"GK"},{id:"rw1",type:"red",nx:0.25,ny:0.41,number:"4",label:"Wall"},{id:"rw2",type:"red",nx:0.25,ny:0.46,number:"5",label:"Wall"},{id:"b_fk1",type:"blue",nx:0.44,ny:0.42,number:"10",label:"Shooter",spotlight:true},{id:"ball_1",type:"ball",nx:0.41,ny:0.44}];drawings.push({type:"curved",points:[{nx:0.41,ny:0.44},{nx:0.04,ny:0.41}],cp:{nx:0.23,ny:0.28},color:"#facc15",width:3});}

  else if(t==="high_press"){setPitchMode("full");pieces=[];formationTemplates["4-2-3-1"].forEach((p,i)=>pieces.push({id:"red_"+i,type:"red",nx:p.nx*0.85,ny:p.ny,number:p.num,label:p.label}));formationTemplates["4-3-3"].forEach((p,i)=>pieces.push({id:"blue_"+i,type:"blue",nx:1-p.nx*1.45,ny:p.ny,number:p.num,label:p.label,spotlight:p.num==="9"}));pieces.push({id:"ball_1",type:"ball",nx:0.18,ny:0.38});}
  else if(t==="counter_att"){setPitchMode("full");pieces=[{id:"r_dm",type:"red",nx:0.35,ny:0.48,number:"6",label:"Carrier",spotlight:true},{id:"r_lw",type:"red",nx:0.44,ny:0.18,number:"11",label:"Sprint"},{id:"b_cb1",type:"blue",nx:0.55,ny:0.38,number:"4",label:"CB"},{id:"ball_1",type:"ball",nx:0.37,ny:0.48}];drawings.push({type:"curved",points:[{nx:0.44,ny:0.18},{nx:0.76,ny:0.22}],cp:{nx:0.60,ny:0.12},color:"#facc15",width:3});}
  else if(t==="rondo_drill"){setPitchMode("half");pieces=[{id:"mg1",type:"minigoal",nx:0.08,ny:0.30},{id:"mg2",type:"minigoal",nx:0.08,ny:0.70},{id:"c1",type:"cone",nx:0.25,ny:0.25},{id:"c2",type:"cone",nx:0.58,ny:0.25},{id:"c3",type:"cone",nx:0.25,ny:0.75},{id:"c4",type:"cone",nx:0.58,ny:0.75},{id:"r1",type:"red",nx:0.28,ny:0.40,number:"6",label:"Pivot",spotlight:true},{id:"r2",type:"red",nx:0.28,ny:0.60,number:"8",label:"CM"},{id:"r3",type:"red",nx:0.55,ny:0.40,number:"10",label:"CAM"},{id:"r4",type:"red",nx:0.55,ny:0.60,number:"7",label:"RW"},{id:"b1",type:"blue",nx:0.41,ny:0.42,number:"9",label:"Press"},{id:"b2",type:"blue",nx:0.41,ny:0.58,number:"11",label:"Press"},{id:"ball_1",type:"ball",nx:0.30,ny:0.41}];}

function resizeCanvas(){
  const w=document.getElementById("pitch-wrapper");
  const rect=w?w.getBoundingClientRect():{width:920,height:600};
  const aW=Math.max(520,(rect.width>100?rect.width:920)-20);
  const aH=Math.max(360,(rect.height>100?rect.height:600)-10);
  const tr=pitchMode==="full"?(105/68):(68/52.5);
  let fW=aW,fH=aW/tr;if(fH>aH){fH=aH;fW=aH*tr;}
  canvas.width=Math.round(fW);canvas.height=Math.round(fH);
  canvas.style.width=Math.round(fW)+"px";canvas.style.height=Math.round(fH)+"px";
  const m=Math.max(12,Math.min(fW,fH)*0.025);
  pitchRect={x:m,y:m,w:fW-m*2,h:fH-m*2,canvasW:fW,canvasH:fH};
  render();
}

const calculateMeters=(p1,p2)=>Math.hypot((p2.nx-p1.nx)*(pitchMode==="full"?105:52.5),(p2.ny-p1.ny)*68).toFixed(1);
function computeConvexHull(pts){if(pts.length<3)return pts;const s=[...pts].sort((a,b)=>a.nx===b.nx?a.ny-b.ny:a.nx-b.nx),cr=(o,a,b)=>(a.nx-o.nx)*(b.ny-o.ny)-(a.ny-o.ny)*(b.nx-o.nx),lo=[],up=[];for(const p of s){while(lo.length>=2&&cr(lo[lo.length-2],lo[lo.length-1],p)<=0)lo.pop();lo.push(p);}for(let i=s.length-1;i>=0;i--){const p=s[i];while(up.length>=2&&cr(up[up.length-2],up[up.length-1],p)<=0)up.pop();up.push(p);}lo.pop();up.pop();return lo.concat(up);}

function drawPitch(){
  const{w,h,canvasW,canvasH}=pitchRect;if(w<=0||h<=0)return;
  const th=pitchThemes[pitchTheme]||pitchThemes.green;
  ctx.fillStyle=th.outer;ctx.fillRect(0,0,canvasW,canvasH);
  const tl=normToCanvas(0,0),tr=normToCanvas(1,0),br=normToCanvas(1,1),bl=normToCanvas(0,1);
  ctx.save();ctx.beginPath();ctx.moveTo(tl.x,tl.y);ctx.lineTo(tr.x,tr.y);ctx.lineTo(br.x,br.y);ctx.lineTo(bl.x,bl.y);ctx.closePath();
  ctx.fillStyle=th.inner;ctx.fill();ctx.clip();
  if(th.stripes){const s=pitchMode==="full"?14:8;for(let i=0;i<s;i+=2){const pA=normToCanvas(i/s,0),pB=normToCanvas((i+1)/s,0),pC=normToCanvas((i+1)/s,1),pD=normToCanvas(i/s,1);ctx.fillStyle=th.stripeColor;ctx.beginPath();ctx.moveTo(pA.x,pA.y);ctx.lineTo(pB.x,pB.y);ctx.lineTo(pC.x,pC.y);ctx.lineTo(pD.x,pD.y);ctx.closePath();ctx.fill();}}
  ctx.restore();
  function lineN(nx1,ny1,nx2,ny2){const a=normToCanvas(nx1,ny1),b=normToCanvas(nx2,ny2);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}
  function rectN(nx,ny,nw,nh){const a=normToCanvas(nx,ny),b=normToCanvas(nx+nw,ny),c=normToCanvas(nx+nw,ny+nh),d=normToCanvas(nx,ny+nh);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.lineTo(c.x,c.y);ctx.lineTo(d.x,d.y);ctx.closePath();ctx.stroke();}
  ctx.strokeStyle=th.lines;ctx.lineWidth=2;rectN(0,0,1,1);
  const len=pitchMode==="full"?105:52.5,penW=16.5/len,penH=40.32/68,penY=(1-penH)/2,goalW=5.5/len,goalH=18.32/68,goalY=(1-goalH)/2;
  rectN(0,penY,penW,penH);rectN(0,goalY,goalW,goalH);
  if(showZones){ctx.save();ctx.strokeStyle="rgba(250,204,21,0.4)";ctx.setLineDash([5,5]);[penY,goalY,goalY+goalH,penY+penH].forEach(ny=>lineN(0,ny,1,ny));[1/3,2/3].forEach(nx=>lineN(nx,0,nx,1));ctx.restore();}
  if(pitchMode==="full"){lineN(0.5,0,0.5,1);rectN(1-penW,penY,penW,penH);rectN(1-goalW,goalY,goalW,goalH);const c=normToCanvas(0.5,0.5),rx=(9.15/len)*w*(is3D?0.86:1),ry=(9.15/68)*h*(is3D?0.75:1);ctx.beginPath();ctx.ellipse(c.x,c.y,rx,ry,0,0,Math.PI*2);ctx.stroke();}
  if(showOffside){ctx.save();ctx.strokeStyle="#f43f5e";ctx.setLineDash([7,5]);lineN(offsideNx,0,offsideNx,1);ctx.restore();}
}

function drawDynamicLinks(){ctx.save();links.forEach(lk=>{const pA=pieces.find(p=>p.id===lk.from),pB=pieces.find(p=>p.id===lk.to);if(!pA||!pB)return;const c1=normToCanvas(pA.nx,pA.ny),c2=normToCanvas(pB.nx,pB.ny);ctx.strokeStyle=lk.color||"#facc15";ctx.lineWidth=2.5;ctx.setLineDash([6,4]);ctx.beginPath();ctx.moveTo(c1.x,c1.y);ctx.lineTo(c2.x,c2.y);ctx.stroke();const dist=calculateMeters(pA,pB)+"m",mx=(c1.x+c2.x)/2,my=(c1.y+c2.y)/2;ctx.setLineDash([]);ctx.font="bold 10px Inter,sans-serif";const tw=ctx.measureText(dist).width+8;ctx.fillStyle="rgba(15,23,42,0.85)";ctx.fillRect(mx-tw/2,my-8,tw,16);ctx.fillStyle=lk.color||"#facc15";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(dist,mx,my);});ctx.restore();}
function drawMotionTrails(){if(!showTrails||isPlaying||currentFrameIdx===0||!keyframes[currentFrameIdx-1])return;const prevPieces=keyframes[currentFrameIdx-1].pieces;ctx.save();pieces.forEach(p=>{const prev=prevPieces.find(x=>x.id===p.id);if(!prev||Math.hypot(p.nx-prev.nx,p.ny-prev.ny)<0.01)return;const c1=normToCanvas(prev.nx,prev.ny),c2=normToCanvas(p.nx,p.ny);ctx.strokeStyle=p.type==="red"?"rgba(248,113,113,0.55)":(p.type==="blue"?"rgba(56,189,248,0.55)":"rgba(250,204,21,0.65)");ctx.lineWidth=2;ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(c1.x,c1.y);ctx.lineTo(c2.x,c2.y);ctx.stroke();});ctx.restore();}
function getCurveControlPoint(item){if(item.cp)return item.cp;const p0=item.points[0],p1=item.points[1],dx=p1.nx-p0.nx,dy=p1.ny-p0.ny,dist=Math.hypot(dx,dy)||0.001,off=item.type==="curved"?dist*0.25:0;return{nx:(p0.nx+p1.nx)/2+(-dy/dist)*off,ny:(p0.ny+p1.ny)/2+(dx/dist)*off};}

function renderDrawingItem(item,showHandles=false){
  ctx.save();ctx.strokeStyle=item.color;ctx.fillStyle=item.color;ctx.lineWidth=item.width||3;ctx.lineCap="round";
  const p1=normToCanvas(item.points[0].nx,item.points[0].ny),p2=item.points[1]?normToCanvas(item.points[1].nx,item.points[1].ny):p1;
  if(item.type==="arrow"||item.type==="pass"||item.type==="curved"){
    const cp=normToCanvas(getCurveControlPoint(item).nx,getCurveControlPoint(item).ny);
    ctx.save();if(item.type==="pass")ctx.setLineDash([8,6]);ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.quadraticCurveTo(cp.x,cp.y,p2.x,p2.y);ctx.stroke();ctx.restore();
    const ang=Math.atan2(p2.y-cp.y,p2.x-cp.x),hl=11+(item.width||3)*1.5;ctx.beginPath();ctx.moveTo(p2.x,p2.y);ctx.lineTo(p2.x-hl*Math.cos(ang-0.52),p2.y-hl*Math.sin(ang-0.52));ctx.lineTo(p2.x-hl*Math.cos(ang+0.52),p2.y-hl*Math.sin(ang+0.52));ctx.closePath();ctx.fill();
    if(showHandles&&!isPlaying){ctx.beginPath();ctx.arc(cp.x,cp.y,5.5,0,Math.PI*2);ctx.fillStyle="#facc15";ctx.fill();ctx.strokeStyle="#0f172a";ctx.lineWidth=1.5;ctx.stroke();}
  }else if(item.type==="dribble"){
    const dx=p2.x-p1.x,dy=p2.y-p1.y,dist=Math.hypot(dx,dy),ang=Math.atan2(dy,dx),steps=Math.max(4,Math.floor(dist/12));ctx.beginPath();ctx.moveTo(p1.x,p1.y);for(let i=1;i<=steps;i++){const t=i/steps,bx=p1.x+dx*t,by=p1.y+dy*t,amp=(i===steps)?0:((i%2===0?1:-1)*5);ctx.lineTo(bx-Math.sin(ang)*amp,by+Math.cos(ang)*amp);}ctx.stroke();
    const hl=11;ctx.beginPath();ctx.moveTo(p2.x,p2.y);ctx.lineTo(p2.x-hl*Math.cos(ang-0.5),p2.y-hl*Math.sin(ang-0.5));ctx.lineTo(p2.x-hl*Math.cos(ang+0.5),p2.y-hl*Math.sin(ang+0.5));ctx.closePath();ctx.fill();
  }else if(item.type==="shadow"){
    const ang=Math.atan2(p2.y-p1.y,p2.x-p1.x),dist=Math.max(45,Math.hypot(p2.x-p1.x,p2.y-p1.y)*2.4),g=ctx.createRadialGradient(p1.x,p1.y,5,p1.x,p1.y,dist);g.addColorStop(0,hexToRgba(item.color,0.42));g.addColorStop(1,hexToRgba(item.color,0.03));ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.arc(p1.x,p1.y,dist,ang-0.26,ang+0.26);ctx.closePath();ctx.fill();
  }else if(item.type==="vision"){
    const ang=Math.atan2(p2.y-p1.y,p2.x-p1.x),dist=Math.max(55,Math.hypot(p2.x-p1.x,p2.y-p1.y));ctx.fillStyle=hexToRgba(item.color,0.18);ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.arc(p1.x,p1.y,dist,ang-0.58,ang+0.58);ctx.closePath();ctx.fill();ctx.stroke();
  }else if(item.type==="polygon"){
    ctx.beginPath();item.points.forEach((pt,i)=>{const c=normToCanvas(pt.nx,pt.ny);i===0?ctx.moveTo(c.x,c.y):ctx.lineTo(c.x,c.y);});ctx.closePath();ctx.fillStyle=hexToRgba(item.color,0.24);ctx.fill();ctx.stroke();
  }else if(item.type==="ruler"){
    ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.stroke();const lbl=calculateMeters(item.points[0],item.points[1])+" m",mx=(p1.x+p2.x)/2,my=(p1.y+p2.y)/2;ctx.font="bold 12px Inter,sans-serif";const tw=ctx.measureText(lbl).width+12;ctx.fillStyle="#0f172a";ctx.fillRect(mx-tw/2,my-11,tw,22);ctx.strokeRect(mx-tw/2,my-11,tw,22);ctx.fillStyle=item.color;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(lbl,mx,my);
  }else if(item.type==="text"){
    ctx.font="bold 13px Cairo,sans-serif";const tw=ctx.measureText(item.text).width+16;ctx.fillStyle="rgba(15,23,42,0.9)";ctx.fillRect(p1.x-tw/2,p1.y-13,tw,26);ctx.strokeRect(p1.x-tw/2,p1.y-13,tw,26);ctx.fillStyle=item.color;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(item.text,p1.x,p1.y);
  }
  ctx.restore();
}

function drawPieces(){
  const baseR=Math.max(14,Math.min(18,pitchRect.w*0.021)),pulseExpand=Math.sin(pulsePhase)*4.5,pulseAlpha=0.22+Math.abs(Math.sin(pulsePhase))*0.22;
  pieces.forEach(p=>{
    const pos=normToCanvas(p.nx,p.ny),r=baseR*(pos.scale||1);ctx.save();
    if(p.type==="red"||p.type==="blue"){
      if(p.spotlight||p.id===linkSourceId){ctx.beginPath();ctx.arc(pos.x,pos.y,r+8+pulseExpand,0,Math.PI*2);ctx.fillStyle=`rgba(250,204,21,${pulseAlpha.toFixed(2)})`;ctx.fill();ctx.strokeStyle="#facc15";ctx.lineWidth=2;ctx.setLineDash([4,3]);ctx.stroke();ctx.setLineDash([]);}
      const meta=p.type==="red"?redTeamMeta:blueTeamMeta;
      ctx.beginPath();ctx.arc(pos.x,pos.y,r,0,Math.PI*2);ctx.clip();ctx.fillStyle=p.customColor||meta.primary;ctx.fillRect(pos.x-r,pos.y-r,r*2,r*2);
      if(!p.customColor&&meta.pattern==="striped"){ctx.fillStyle=meta.secondary;ctx.fillRect(pos.x-r*0.48,pos.y-r,r*0.32,r*2);ctx.fillRect(pos.x+r*0.16,pos.y-r,r*0.32,r*2);}
      else if(!p.customColor&&meta.pattern==="halves"){ctx.fillStyle=meta.secondary;ctx.fillRect(pos.x,pos.y-r,r,r*2);}
      ctx.restore();ctx.save();ctx.beginPath();ctx.arc(pos.x,pos.y,r,0,Math.PI*2);ctx.strokeStyle=pitchTheme==="opta"?"#0f172a":"#fff";ctx.lineWidth=2;ctx.stroke();
      ctx.font=`bold ${r*0.72}px Inter,sans-serif`;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillStyle="#fff";ctx.fillText(p.number||"",pos.x,pos.y);
      if(p.label){ctx.font="bold 10px Cairo,sans-serif";const lw=ctx.measureText(p.label).width+8;ctx.fillStyle="rgba(15,23,42,0.88)";ctx.fillRect(pos.x-lw/2,pos.y+r+3,lw,14);ctx.fillStyle="#f8fafc";ctx.fillText(p.label,pos.x,pos.y+r+10);}
    }else if(p.type==="ball"){ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(pos.x,pos.y,r*0.62,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#0f172a";ctx.lineWidth=2;ctx.stroke();}
    else if(p.type==="cone"){const cr=r*0.65;ctx.fillStyle="#f97316";ctx.beginPath();ctx.moveTo(pos.x,pos.y-cr);ctx.lineTo(pos.x+cr,pos.y+cr*0.8);ctx.lineTo(pos.x-cr,pos.y+cr*0.8);ctx.closePath();ctx.fill();}
    else if(p.type==="mannequin"){ctx.fillStyle="#a855f7";ctx.fillRect(pos.x-r*0.36,pos.y-r*0.5,r*0.72,r*1.1);}
    else if(p.type==="minigoal"){ctx.strokeStyle="#10b981";ctx.lineWidth=2.5;ctx.strokeRect(pos.x-r*0.5,pos.y-r*1.1,r,r*2.2);}
    else if(p.type==="hurdle"){ctx.strokeStyle="#38bdf8";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(pos.x-r*0.8,pos.y);ctx.lineTo(pos.x+r*0.8,pos.y);ctx.stroke();}
    else if(p.type==="ladder"){ctx.strokeStyle="#facc15";ctx.lineWidth=2;ctx.strokeRect(pos.x-r*0.4,pos.y-r,r*0.8,r*2);}
    ctx.restore();
  });
}

function updateAndDrawCompactness(){const elR=document.getElementById("metrics-red"),elB=document.getElementById("metrics-blue");if(!showCompactness){elR.classList.add("hidden");elB.classList.add("hidden");return;}elR.classList.remove("hidden");elB.classList.remove("hidden");const lenM=pitchMode==="full"?105:52.5;["red","blue"].forEach(t=>{const out=pieces.filter(p=>p.type===t&&p.label!=="GK"&&p.number!=="1"),el=t==="red"?elR:elB,meta=t==="red"?redTeamMeta:blueTeamMeta;if(out.length>=2){const xs=out.map(p=>p.nx),ys=out.map(p=>p.ny);el.textContent=`L:${((Math.max(...xs)-Math.min(...xs))*lenM).toFixed(1)}m × W:${((Math.max(...ys)-Math.min(...ys))*68).toFixed(1)}m`;if(out.length>=3){const hull=computeConvexHull(out);ctx.save();ctx.beginPath();hull.forEach((pt,i)=>{const c=normToCanvas(pt.nx,pt.ny);i===0?ctx.moveTo(c.x,c.y):ctx.lineTo(c.x,c.y);});ctx.closePath();ctx.fillStyle=hexToRgba(meta.primary,0.14);ctx.strokeStyle=hexToRgba(meta.primary,0.55);ctx.setLineDash([5,5]);ctx.fill();ctx.stroke();ctx.restore();}}});}
function render(){drawPitch();updateAndDrawCompactness();drawDynamicLinks();drawMotionTrails();const showHandles=(currentTool==="select");drawings.forEach(d=>renderDrawingItem(d,showHandles));if(currentDraft)renderDrawingItem(currentDraft,false);if(polygonPoints.length>0)renderDrawingItem({type:"polygon",points:polygonPoints,color:currentColor,width:currentStrokeWidth},false);drawPieces();}

function getPointerPos(e){const rect=canvas.getBoundingClientRect(),cx=e.touches?e.touches[0].clientX:e.clientX,cy=e.touches?e.touches[0].clientY:e.clientY;return{x:cx-rect.left,y:cy-rect.top};}
canvas.addEventListener("mousedown",e=>{
  const pos=getPointerPos(e),norm=canvasToNorm(pos.x,pos.y);
  if(showOffside&&Math.abs(pos.x-normToCanvas(offsideNx,0.5).x)<14){draggingOffside=true;return;}
  if(currentTool==="link"){const hit=[...pieces].reverse().find(p=>{const c=normToCanvas(p.nx,p.ny);return Math.hypot(pos.x-c.x,pos.y-c.y)<=22;});if(hit){if(!linkSourceId)linkSourceId=hit.id;else if(linkSourceId!==hit.id){saveHistory();const idx=links.findIndex(l=>(l.from===linkSourceId&&l.to===hit.id)||(l.from===hit.id&&l.to===linkSourceId));if(idx>=0)links.splice(idx,1);else links.push({from:linkSourceId,to:hit.id,color:currentColor});linkSourceId=null;syncCurrentFrame();}render();}return;}
  if(currentTool==="spotlight"){const hit=[...pieces].reverse().find(p=>{const c=normToCanvas(p.nx,p.ny);return Math.hypot(pos.x-c.x,pos.y-c.y)<=22;});if(hit&&(hit.type==="red"||hit.type==="blue")){saveHistory();hit.spotlight=!hit.spotlight;syncCurrentFrame();render();}return;}
  if(currentTool==="select"){
    const hitCurve=[...drawings].reverse().find(d=>{if(d.type!=="arrow"&&d.type!=="pass"&&d.type!=="curved")return false;const cp=normToCanvas(getCurveControlPoint(d).nx,getCurveControlPoint(d).ny);return Math.hypot(pos.x-cp.x,pos.y-cp.y)<=12;});
    if(hitCurve){saveHistory();draggingControlPoint=hitCurve;return;}
    const hit=[...pieces].reverse().find(p=>{const c=normToCanvas(p.nx,p.ny);return Math.hypot(pos.x-c.x,pos.y-c.y)<=22;});
    if(hit){saveHistory();draggingPiece=hit;const c=normToCanvas(hit.nx,hit.ny);dragOffset={x:pos.x-c.x,y:pos.y-c.y};}
  }else if(currentTool==="polygon"){polygonPoints.push(norm);document.getElementById("polygon-controls").classList.remove("hidden");render();}
  else if(currentTool==="text"){pendingTextPos=norm;document.getElementById("annotation-input").value="";document.getElementById("text-modal").classList.remove("hidden");}
  else{isDrawing=true;currentDraft={type:currentTool,points:[norm,norm],color:currentColor,width:currentStrokeWidth};}
});
canvas.addEventListener("mousemove",e=>{const pos=getPointerPos(e);if(draggingOffside){offsideNx=canvasToNorm(pos.x,pos.y).nx;render();return;}if(draggingControlPoint){draggingControlPoint.cp=canvasToNorm(pos.x,pos.y);render();return;}if(draggingPiece){const n=canvasToNorm(pos.x-dragOffset.x,pos.y-dragOffset.y);draggingPiece.nx=n.nx;draggingPiece.ny=n.ny;render();}else if(isDrawing&&currentDraft){currentDraft.points[1]=canvasToNorm(pos.x,pos.y);currentDraft.cp=getCurveControlPoint(currentDraft);render();}});
window.addEventListener("mouseup",()=>{if(draggingOffside){draggingOffside=false;return;}if(draggingControlPoint){draggingControlPoint=null;syncCurrentFrame();render();return;}if(draggingPiece){draggingPiece=null;syncCurrentFrame();render();}else if(isDrawing&&currentDraft){isDrawing=false;if(Math.hypot(currentDraft.points[1].nx-currentDraft.points[0].nx,currentDraft.points[1].ny-currentDraft.points[0].ny)>0.015){saveHistory();currentDraft.cp=getCurveControlPoint(currentDraft);drawings.push(currentDraft);syncCurrentFrame();}currentDraft=null;render();}});
canvas.addEventListener("dblclick",e=>{const pos=getPointerPos(e),hit=[...pieces].reverse().find(p=>{const c=normToCanvas(p.nx,p.ny);return Math.hypot(pos.x-c.x,pos.y-c.y)<=22;});if(hit){editingPieceId=hit.id;document.getElementById("edit-number").value=hit.number||"";document.getElementById("edit-label").value=hit.label||"";document.getElementById("edit-use-custom-color").checked=!!hit.customColor;document.getElementById("edit-custom-color").value=hit.customColor||"#eab308";document.getElementById("edit-spotlight").checked=!!hit.spotlight;document.getElementById("edit-modal").classList.remove("hidden");}});

function exportJSON(){syncCurrentFrame();const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify({redTeamMeta,blueTeamMeta,pitchMode,keyframes})],{type:"application/json"}));a.download=`tactic_${Date.now()}.json`;a.click();}
function importJSON(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{const d=JSON.parse(ev.target.result);if(d.redTeamMeta)redTeamMeta=d.redTeamMeta;if(d.blueTeamMeta)blueTeamMeta=d.blueTeamMeta;if(d.keyframes?.length){keyframes=d.keyframes;selectKeyframe(0);}updateTeamBanner();renderFramesBar();resizeCanvas();}catch{}};r.readAsText(f);}
function setTool(t){currentTool=t;linkSourceId=null;document.querySelectorAll(".tool-btn").forEach(b=>b.classList.remove("active"));document.getElementById("tool-"+t)?.classList.add("active");render();}
function setColor(hex){currentColor=hex;document.querySelectorAll(".color-btn").forEach(b=>b.classList.toggle("ring-2",b.dataset.color===hex));}
function setPitchMode(m){pitchMode=m;document.querySelectorAll(".pitch-mode-btn").forEach(b=>b.classList.remove("bg-slate-700","text-white"));document.getElementById("btn-pitch-"+m).classList.add("bg-slate-700","text-white");resizeCanvas();}
function toggleZones(){showZones=!showZones;document.getElementById("btn-toggle-zones").classList.toggle("active",showZones);render();}
function toggleOffside(){showOffside=!showOffside;document.getElementById("btn-toggle-offside").classList.toggle("active",showOffside);render();}
function toggleCompactness(){showCompactness=!showCompactness;document.getElementById("btn-toggle-compact").classList.toggle("active",showCompactness);render();}
function saveHistory(){historyStack.push({pieces:JSON.parse(JSON.stringify(pieces)),drawings:JSON.parse(JSON.stringify(drawings)),links:JSON.parse(JSON.stringify(links))});if(historyStack.length>25)historyStack.shift();}
function undoAction(){if(!historyStack.length)return;const prev=historyStack.pop();pieces=prev.pieces;drawings=prev.drawings;links=prev.links||[];syncCurrentFrame();render();}
function clearDrawings(){saveHistory();drawings=[];links=[];polygonPoints=[];syncCurrentFrame();render();}
function resetBoard(){saveHistory();drawings=[];links=[];initDefaultPieces();render();}
function addPiece(type){saveHistory();pieces.push({id:type+Date.now(),type,nx:0.5,ny:0.5,number:type==="red"||type==="blue"?"12":"",label:"",spotlight:false});syncCurrentFrame();render();}
function finishPolygon(){if(polygonPoints.length>=3){saveHistory();drawings.push({type:"polygon",points:[...polygonPoints],color:currentColor,width:currentStrokeWidth});syncCurrentFrame();}cancelPolygon();}
function cancelPolygon(){polygonPoints=[];document.getElementById("polygon-controls").classList.add("hidden");render();}
function closeTextModal(){document.getElementById("text-modal").classList.add("hidden");}
function confirmTextAnnotation(){const v=document.getElementById("annotation-input").value.trim();if(v&&pendingTextPos){saveHistory();drawings.push({type:"text",points:[pendingTextPos],color:currentColor,text:v});syncCurrentFrame();render();}closeTextModal();}
function closeEditModal(){document.getElementById("edit-modal").classList.add("hidden");}
function saveEditModal(){const p=pieces.find(x=>x.id===editingPieceId);if(p){saveHistory();p.number=document.getElementById("edit-number").value;p.label=document.getElementById("edit-label").value;p.customColor=document.getElementById("edit-use-custom-color").checked?document.getElementById("edit-custom-color").value:null;p.spotlight=document.getElementById("edit-spotlight").checked;syncCurrentFrame();render();}closeEditModal();}
function deleteSelectedPiece(){saveHistory();pieces=pieces.filter(x=>x.id!==editingPieceId);links=links.filter(l=>l.from!==editingPieceId&&l.to!==editingPieceId);syncCurrentFrame();closeEditModal();render();}
function openLineupModal(){document.getElementById("input-red-team-name").value=redTeamMeta.name;document.getElementById("select-red-formation").value=redTeamMeta.formation;document.getElementById("input-blue-team-name").value=blueTeamMeta.name;document.getElementById("select-blue-formation").value=blueTeamMeta.formation;populateLineupInputs("red",redTeamMeta.formation,true);populateLineupInputs("blue",blueTeamMeta.formation,true);document.getElementById("lineup-modal").classList.remove("hidden");}
function closeLineupModal(){document.getElementById("lineup-modal").classList.add("hidden");}
function populateLineupInputs(team,form,keep){const el=document.getElementById(team+"-players-list"),tpl=formationTemplates[form],cur=pieces.filter(p=>p.type===team);el.innerHTML="";tpl.forEach((s,i)=>{const num=keep&&cur[i]?cur[i].number:s.num,lbl=keep&&cur[i]?cur[i].label:s.label;el.innerHTML+=`<div class="flex gap-1.5 items-center"><input data-team="${team}" data-idx="${i}" data-f="num" value="${num}" class="w-11 bg-slate-950 border border-slate-700 rounded px-1.5 py-1 text-xs text-center text-white font-en"><input data-team="${team}" data-idx="${i}" data-f="lbl" value="${lbl}" class="flex-1 bg-slate-950 border border-slate-700 rounded px-2 py-1 text-xs text-white"></div>`;});}
function applyBothTeamsLineups(){saveHistory();redTeamMeta.name=document.getElementById("input-red-team-name").value||"الفريق الأول";redTeamMeta.formation=document.getElementById("select-red-formation").value;blueTeamMeta.name=document.getElementById("input-blue-team-name").value||"الفريق الثاني";blueTeamMeta.formation=document.getElementById("select-blue-formation").value;pieces=pieces.filter(p=>p.type!=="red"&&p.type!=="blue");formationTemplates[redTeamMeta.formation].forEach((s,i)=>pieces.push({id:"red_"+i,type:"red",nx:s.nx,ny:s.ny,number:document.querySelector(`input[data-team="red"][data-idx="${i}"][data-f="num"]`).value,label:document.querySelector(`input[data-team="red"][data-idx="${i}"][data-f="lbl"]`).value,spotlight:false}));formationTemplates[blueTeamMeta.formation].forEach((s,i)=>pieces.push({id:"blue_"+i,type:"blue",nx:1-s.nx,ny:s.ny,number:document.querySelector(`input[data-team="blue"][data-idx="${i}"][data-f="num"]`).value,label:document.querySelector(`input[data-team="blue"][data-idx="${i}"][data-f="lbl"]`).value,spotlight:false}));updateTeamBanner();syncCurrentFrame();closeLineupModal();render();}
function exportPNG(){const a=document.createElement("a");a.download=`tactic_${Date.now()}.png`;a.href=canvas.toDataURL("image/png",1.0);a.click();}
function hexToRgba(hex,a){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return`rgba(${r},${g},${b},${a})`;}
let toastTimer=null;function showToast(m){const el=document.getElementById("toast-msg");el.textContent=m;el.classList.remove("opacity-0");clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add("opacity-0"),2000);}

setInterval(()=>{if((pieces.some(p=>p.spotlight)||linkSourceId)&&!isPlaying){pulsePhase+=0.25;render();}},60);
window.addEventListener("resize",resizeCanvas);
initDefaultPieces();
render();
setTimeout(resizeCanvas,150);
</script>
</body>
</html>
