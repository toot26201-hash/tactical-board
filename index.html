<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ProTactics Studio 3D PRO</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Inter:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  html, body { width: 100%; height: 100vh; margin: 0; padding: 0; font-family: "Cairo", "Inter", sans-serif; background: #0b0f19; color: #e2e8f0; overflow: hidden; user-select: none; }
  .font-en { font-family: "Inter", sans-serif; }
  .tool-btn.active { background: #2563eb; color: #fff; border-color: #60a5fa; box-shadow: 0 0 10px rgba(37,99,235,0.4); }
  .toggle-pill.active { background: #1e293b; border-color: #38bdf8; color: #38bdf8; }
  .frame-btn.active { background: #10b981; color: #fff; border-color: #34d399; }
  .stroke-btn.active { background: #334155; border-color: #facc15; color: #facc15; }
  canvas { touch-action: none; display: block; margin: 0 auto; cursor: crosshair; }
  input[type="color"] { -webkit-appearance: none; border: none; padding: 0; }
  input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
  input[type="color"]::-webkit-color-swatch { border: 1px solid rgba(255,255,255,0.35); border-radius: 4px; }
</style>
</head>
<body class="w-full h-screen flex flex-col bg-[#0b0f19] overflow-hidden">

<header class="bg-[#111827] border-b border-slate-800 px-3 py-1.5 flex flex-wrap items-center justify-between gap-1.5 shrink-0">
  <div class="flex items-center gap-2">
    <span class="text-sm font-extrabold text-white tracking-wide">⚽ ProTactics <span class="text-[10px] text-amber-300 bg-amber-950 border border-amber-700 px-1.5 py-0.5 rounded-full">3D PRO</span></span>
    <button onclick="openLineupModal()" class="bg-blue-600 hover:bg-blue-500 text-white text-[11px] px-2.5 py-1 rounded-lg font-bold flex items-center gap-1">
      <i class="fa-solid fa-users-gear"></i> الأسماء والتشكيلات
    </button>
  </div>

  <div class="flex flex-wrap items-center gap-1">
    <select onchange="loadSetPiece(this.value);this.value='';" class="bg-slate-900 border border-slate-700 text-amber-300 text-[11px] px-2 py-1 rounded-lg font-semibold">
      <option value="">⚡ قوالب جاهزة</option>
      <option value="corner_att">ركنية هجومية</option>
      <option value="fk_direct">ركلة حرة وحائط صد</option>
      <option value="gk_buildup">بناء لعب من المرمى</option>
      <option value="high_press">ضغط عالي (4-3-3 vs 4-2-3-1)</option>
      <option value="counter_att">تحول هجومي سريع</option>
      <option value="rondo_drill">تدريب رندو (Rondo)</option>
    </select>

    <div class="flex bg-slate-900 p-0.5 rounded-lg border border-slate-800">
      <button onclick="setPitchMode('full')" id="btn-pitch-full" class="pitch-mode-btn bg-slate-700 text-white text-[11px] px-2 py-0.5 rounded font-semibold">ملعب كامل</button>
      <button onclick="setPitchMode('half')" id="btn-pitch-half" class="pitch-mode-btn text-slate-400 text-[11px] px-2 py-0.5 rounded font-semibold">نصف ملعب</button>
    </div>

    <button onclick="toggle3D()" id="btn-toggle-3d" class="toggle-pill bg-slate-900 text-amber-300 border border-amber-700/60 text-[11px] px-2.5 py-1 rounded-lg font-en font-bold">3D View</button>
    <button onclick="toggleZones()" id="btn-toggle-zones" class="toggle-pill bg-slate-900 text-slate-300 border border-slate-700 text-[11px] px-2 py-1 rounded-lg font-semibold">5-Zones</button>
    <button onclick="toggleOffside()" id="btn-toggle-offside" class="toggle-pill bg-slate-900 text-slate-300 border border-slate-700 text-[11px] px-2 py-1 rounded-lg font-semibold">التسلل</button>
    <button onclick="toggleCompactness()" id="btn-toggle-compact" class="toggle-pill bg-slate-900 text-slate-300 border border-slate-700 text-[11px] px-2 py-1 rounded-lg font-semibold">التماسك</button>
    <button onclick="toggleTrails()" id="btn-toggle-trails" class="toggle-pill active bg-slate-900 text-slate-300 border border-slate-700 text-[11px] px-2 py-1 rounded-lg font-semibold">مسار الحركة</button>
    <button onclick="toggleNotesPanel()" id="btn-toggle-notes" class="toggle-pill bg-slate-900 text-slate-300 border border-slate-700 text-[11px] px-2 py-1 rounded-lg font-semibold">الملاحظات</button>

    <select id="pitch-theme-select" onchange="setPitchTheme(this.value)" class="bg-slate-900 border border-slate-700 text-slate-200 text-[11px] px-1.5 py-1 rounded-lg">
      <option value="green">أخضر عشبي</option>
      <option value="classic">أخضر فاتح</option>
      <option value="navy">كحلي تكتيكي</option>
      <option value="midnight">أسود ليلي</option>
      <option value="opta">أبيض Opta</option>
    </select>
  </div>

  <div class="flex items-center gap-1">
    <button onclick="exportJSON()" title="حفظ" class="bg-slate-800 text-sky-300 border border-slate-700 text-[11px] px-2 py-1 rounded-lg"><i class="fa-solid fa-floppy-disk"></i></button>
    <label title="فتح" class="bg-slate-800 text-purple-300 border border-slate-700 text-[11px] px-2 py-1 rounded-lg cursor-pointer"><i class="fa-solid fa-folder-open"></i><input type="file" accept=".json" onchange="importJSON(event)" class="hidden"></label>
    <button onclick="undoAction()" title="تراجع (Ctrl+Z)" class="bg-slate-800 text-slate-200 border border-slate-700 text-[11px] px-2 py-1 rounded-lg"><i class="fa-solid fa-rotate-left"></i></button>
    <button onclick="clearDrawings()" title="مسح الخطوط والروابط" class="bg-slate-800 text-amber-300 border border-slate-700 text-[11px] px-2 py-1 rounded-lg"><i class="fa-solid fa-eraser"></i></button>
    <button onclick="resetBoard()" title="إعادة ضبط" class="bg-slate-800 text-red-400 border border-slate-700 text-[11px] px-2 py-1 rounded-lg"><i class="fa-solid fa-trash-can"></i></button>
    <button onclick="exportPNG()" class="bg-emerald-600 text-white font-bold text-[11px] px-2 py-1 rounded-lg">PNG</button>
    <button onclick="exportVideo()" id="btn-export-video" class="bg-rose-600 text-white font-bold text-[11px] px-2 py-1 rounded-lg">فيديو</button>
  </div>
</header>

<div class="flex-1 flex overflow-hidden" style="height: calc(100vh - 46px);">
  <aside class="bg-[#111827] border-l border-slate-800 p-2 flex flex-col gap-1.5 w-52 shrink-0 overflow-y-auto">
    <div class="text-[10px] font-bold text-slate-400">أدوات الرسم والربط</div>
    <div class="grid grid-cols-2 gap-1">
      <button onclick="setTool('select')" id="tool-select" class="tool-btn active p-1.5 rounded border border-slate-700 bg-slate-800 text-[11px]">تحريك وتعديل</button>
      <button onclick="setTool('link')" id="tool-link" class="tool-btn p-1.5 rounded border border-slate-700 bg-slate-800 text-[11px] text-amber-300">🔗 ربط لاعبين</button>
      <button onclick="setTool('curved')" id="tool-curved" class="tool-btn p-1.5 rounded border border-slate-700 bg-slate-800 text-[11px] text-emerald-300">↪ سهم منحني</button>
      <button onclick="setTool('arrow')" id="tool-arrow" class="tool-btn p-1.5 rounded border border-slate-700 bg-slate-800 text-[11px]">➡ سهم مستقيم</button>
      <button onclick="setTool('pass')" id="tool-pass" class="tool-btn p-1.5 rounded border border-slate-700 bg-slate-800 text-[11px]">┄ تمرير</button>
      <button onclick="setTool('dribble')" id="tool-dribble" class="tool-btn p-1.5 rounded border border-slate-700 bg-slate-800 text-[11px] text-sky-300">〰 مراوغة</button>
      <button onclick="setTool('spotlight')" id="tool-spotlight" class="tool-btn p-1.5 rounded border border-slate-700 bg-slate-800 text-[11px] text-amber-200">✨ تمييز لاعب</button>
      <button onclick="setTool('shadow')" id="tool-shadow" class="tool-btn p-1.5 rounded border border-slate-700 bg-slate-800 text-[11px] text-rose-300">ظل دفاعي</button>
      <button onclick="setTool('vision')" id="tool-vision" class="tool-btn p-1.5 rounded border border-slate-700 bg-slate-800 text-[11px] text-cyan-300">مخروط رؤية</button>
      <button onclick="setTool('polygon')" id="tool-polygon" class="tool-btn p-1.5 rounded border border-slate-700 bg-slate-800 text-[11px]">تظليل مساحة</button>
      <button onclick="setTool('ruler')" id="tool-ruler" class="tool-btn p-1.5 rounded border border-slate-700 bg-slate-800 text-[11px]">قياس متر</button>
      <button onclick="setTool('text')" id="tool-text" class="tool-btn p-1.5 rounded border border-slate-700 bg-slate-800 text-[11px]">نص شرح</button>
    </div>

    <div class="flex items-center justify-between bg-slate-900 p-1.5 rounded border border-slate-800">
      <div class="flex items-center gap-1">
        <button onclick="setColor('#facc15')" data-color="#facc15" class="color-btn w-4 h-4 rounded-full bg-yellow-400 ring-2 ring-white"></button>
        <button onclick="setColor('#ffffff')" data-color="#ffffff" class="color-btn w-4 h-4 rounded-full bg-white"></button>
        <button onclick="setColor('#ef4444')" data-color="#ef4444" class="color-btn w-4 h-4 rounded-full bg-red-500"></button>
        <button onclick="setColor('#38bdf8')" data-color="#38bdf8" class="color-btn w-4 h-4 rounded-full bg-sky-400"></button>
        <button onclick="setColor('#10b981')" data-color="#10b981" class="color-btn w-4 h-4 rounded-full bg-emerald-500"></button>
      </div>
      <div class="flex items-center gap-1">
        <button onclick="setStrokeWidth(2)" id="sw-2" class="stroke-btn px-1.5 py-0.5 rounded border border-slate-700 text-[10px]">رفيع</button>
        <button onclick="setStrokeWidth(3)" id="sw-3" class="stroke-btn active px-1.5 py-0.5 rounded border border-slate-700 text-[10px]">وسط</button>
        <button onclick="setStrokeWidth(5)" id="sw-5" class="stroke-btn px-1.5 py-0.5 rounded border border-slate-700 text-[10px]">عريض</button>
      </div>
    </div>

    <div class="text-[10px] font-bold text-slate-400 mt-1">اللاعبون وأدوات التدريب</div>
    <div class="grid grid-cols-2 gap-1">
      <button onclick="addPiece('red')" class="bg-red-950 text-red-300 border border-red-800 py-1 rounded text-[11px]">+ لاعب 1</button>
      <button onclick="addPiece('blue')" class="bg-sky-950 text-sky-300 border border-sky-800 py-1 rounded text-[11px]">+ لاعب 2</button>
      <button onclick="addPiece('ball')" class="bg-slate-800 text-slate-200 border border-slate-700 py-1 rounded text-[11px]">+ كرة</button>
      <button onclick="addPiece('cone')" class="bg-amber-950 text-amber-300 border border-amber-800 py-1 rounded text-[11px]">+ قمع</button>
      <button onclick="addPiece('mannequin')" class="bg-purple-950 text-purple-300 border border-purple-800 py-1 rounded text-[11px]">+ دمية</button>
      <button onclick="addPiece('minigoal')" class="bg-emerald-950 text-emerald-300 border border-emerald-800 py-1 rounded text-[11px]">+ مرمى صغير</button>
      <button onclick="addPiece('hurdle')" class="bg-cyan-950 text-cyan-300 border border-cyan-800 py-1 rounded text-[11px]">+ حاجز قفز</button>
      <button onclick="addPiece('ladder')" class="bg-yellow-950 text-yellow-300 border border-yellow-800 py-1 rounded text-[11px]">+ سلم سرعة</button>
    </div>
  </aside>

  <main id="canvas-container" class="flex-1 relative bg-[#080c14] flex flex-col items-center justify-between p-2 overflow-hidden">
    <!-- شريط التحكم الفوري في ألوان وتشكيلات الفريقين -->
    <div class="w-full max-w-5xl flex flex-wrap items-center justify-between bg-slate-900 border border-slate-800 rounded-lg px-3 py-1 gap-2 shrink-0">
      <div class="flex items-center gap-1.5">
        <img id="banner-red-logo" src="" class="hidden w-5 h-5 object-contain rounded">
        <input type="color" id="quick-red-primary" value="#dc2626" onchange="quickKitUpdate('red')" title="اللون الأساسي" class="w-5 h-5 cursor-pointer bg-transparent">
        <input type="color" id="quick-red-secondary" value="#ffffff" onchange="quickKitUpdate('red')" title="اللون الثانوي" class="w-5 h-5 cursor-pointer bg-transparent">
        <select id="quick-red-pattern" onchange="quickKitUpdate('red')" class="bg-slate-800 border border-slate-700 text-[10px] text-slate-200 px-1 py-0.5 rounded">
          <option value="solid">سادة</option><option value="striped">مقلم</option><option value="halves">نصفين</option>
        </select>
        <span id="display-red-name" class="text-xs font-bold text-white">الفريق الأول</span>
        <select id="quick-red-form" onchange="instantFormationChange('red', this.value)" class="bg-slate-800 border border-slate-700 text-amber-300 text-[11px] font-en font-bold px-1.5 py-0.5 rounded cursor-pointer">
          <option value="5-4-1">5-4-1</option><option value="4-3-3">4-3-3</option><option value="4-2-3-1">4-2-3-1</option><option value="3-5-2">3-5-2</option><option value="3-4-3">3-4-3</option><option value="4-4-2">4-4-2</option>
        </select>
        <span id="metrics-red" class="hidden text-[10px] font-en bg-red-950 border border-red-800 text-red-200 px-2 py-0.5 rounded"></span>
      </div>

      <span class="text-[11px] font-en font-bold text-slate-500">VS</span>

      <div class="flex items-center gap-1.5">
        <span id="metrics-blue" class="hidden text-[10px] font-en bg-sky-950 border border-sky-800 text-sky-200 px-2 py-0.5 rounded"></span>
        <select id="quick-blue-form" onchange="instantFormationChange('blue', this.value)" class="bg-slate-800 border border-slate-700 text-sky-300 text-[11px] font-en font-bold px-1.5 py-0.5 rounded cursor-pointer">
          <option value="4-3-3">4-3-3</option><option value="4-2-3-1">4-2-3-1</option><option value="5-4-1">5-4-1</option><option value="3-5-2">3-5-2</option><option value="3-4-3">3-4-3</option><option value="4-4-2">4-4-2</option>
        </select>
        <span id="display-blue-name" class="text-xs font-bold text-white">الفريق الثاني</span>
        <select id="quick-blue-pattern" onchange="quickKitUpdate('blue')" class="bg-slate-800 border border-slate-700 text-[10px] text-slate-200 px-1 py-0.5 rounded">
          <option value="solid">سادة</option><option value="striped">مقلم</option><option value="halves">نصفين</option>
        </select>
        <input type="color" id="quick-blue-primary" value="#0284c7" onchange="quickKitUpdate('blue')" title="اللون الأساسي" class="w-5 h-5 cursor-pointer bg-transparent">
        <input type="color" id="quick-blue-secondary" value="#ffffff" onchange="quickKitUpdate('blue')" title="اللون الثانوي" class="w-5 h-5 cursor-pointer bg-transparent">
        <img id="banner-blue-logo" src="" class="hidden w-5 h-5 object-contain rounded">
      </div>
    </div>

    <div id="pitch-wrapper" class="w-full flex-1 flex items-center justify-center overflow-hidden my-1" style="min-height: 360px;">
      <canvas id="tactical-canvas" class="rounded-xl shadow-2xl border border-slate-800"></canvas>
    </div>

    <div class="w-full max-w-5xl bg-slate-900 border border-slate-800 rounded-xl px-3 py-1.5 flex items-center justify-between gap-2 shrink-0">
      <div class="flex items-center gap-1.5">
        <button onclick="togglePlayAnimation()" id="btn-play-anim" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-3 py-1 rounded-lg"><span id="play-label">▶ تشغيل</span></button>
        <button onclick="toggleLoopAnim()" id="btn-loop-anim" title="تكرار مستمر" class="bg-slate-800 text-slate-300 border border-slate-700 text-xs px-2 py-1 rounded-lg"><i class="fa-solid fa-repeat"></i></button>
        <button onclick="addKeyframe()" class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold px-2.5 py-1 rounded-lg">+ إطار جديد</button>
        <button onclick="duplicateKeyframe()" title="نسخ الإطار" class="bg-slate-800 text-sky-300 border border-slate-700 text-xs px-2 py-1 rounded-lg"><i class="fa-solid fa-copy"></i></button>
        <button onclick="deleteCurrentKeyframe()" class="bg-slate-800 text-red-400 border border-slate-700 text-xs px-2 py-1 rounded-lg">حذف</button>
      </div>
      <div id="frames-list" class="flex items-center gap-1 overflow-x-auto px-1"></div>
      <div class="flex items-center gap-1.5">
        <span class="text-[10px] text-slate-400">السرعة:</span>
        <select id="anim-speed" class="bg-slate-950 border border-slate-700 rounded px-1.5 py-0.5 text-xs text-white">
          <option value="1500">بطيء</option><option value="900" selected>متوسط</option><option value="450">سريع</option>
        </select>
      </div>
    </div>

    <div id="polygon-controls" class="hidden absolute bottom-16 left-1/2 -translate-x-1/2 bg-slate-900 border border-yellow-500 px-4 py-1.5 rounded-full flex items-center gap-2 z-30">
      <button onclick="finishPolygon()" class="bg-emerald-600 text-white text-xs font-bold px-3 py-1 rounded-full">إغلاق وتظليل</button>
      <button onclick="cancelPolygon()" class="bg-slate-700 text-slate-200 text-xs px-2.5 py-1 rounded-full">إلغاء</button>
    </div>
    <div id="toast-msg" class="pointer-events-none opacity-0 transition-opacity duration-300 absolute top-12 left-1/2 -translate-x-1/2 bg-slate-900 border border-slate-700 text-white text-xs px-4 py-1.5 rounded-full z-40"></div>
  </main>

  <aside id="notes-panel" class="hidden bg-[#111827] border-r border-slate-800 p-3 flex flex-col gap-2 w-60 shrink-0">
    <div class="flex justify-between border-b border-slate-800 pb-1">
      <span class="text-xs font-bold text-sky-400">ملاحظات الإطار</span>
      <button onclick="toggleNotesPanel()" class="text-slate-400 text-xs">✕</button>
    </div>
    <input type="text" id="frame-title-input" oninput="updateFrameNotes()" placeholder="عنوان اللقطة..." class="bg-slate-950 border border-slate-700 rounded px-2 py-1 text-xs text-white">
    <textarea id="frame-notes-input" oninput="updateFrameNotes()" placeholder="اكتب الشرح التكتيكي هنا..." class="bg-slate-950 border border-slate-700 rounded p-2 text-xs text-slate-200 flex-1 resize-none"></textarea>
    <label class="flex items-center gap-1.5 text-[11px] text-slate-300"><input type="checkbox" id="show-note-overlay" checked onchange="render()"> عرض العنوان على الملعب</label>
  </aside>
</div>

<!-- نافذة الأسماء والتشكيلات -->
<div id="lineup-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-3">
  <div class="bg-[#111827] border border-slate-700 rounded-2xl w-full max-w-4xl max-h-[92vh] flex flex-col shadow-2xl">
    <div class="flex justify-between items-center border-b border-slate-800 px-4 py-3">
      <h3 class="text-sm font-bold text-white">إدارة أسماء وأرقام اللاعبين والتشكيلات</h3>
      <button onclick="closeLineupModal()" class="text-slate-400 hover:text-white text-sm">✕</button>
    </div>
    <div class="p-4 overflow-y-auto grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="bg-slate-900 border border-slate-800 p-3 rounded-xl space-y-2">
        <div class="grid grid-cols-2 gap-2">
          <input id="input-red-team-name" value="الفريق الأول" class="bg-slate-950 border border-slate-700 rounded px-2 py-1 text-xs text-white">
          <select id="select-red-formation" onchange="populateLineupInputs('red',this.value,false)" class="bg-slate-950 border border-slate-700 rounded px-2 py-1 text-xs text-white">
            <option value="5-4-1">5-4-1</option><option value="4-3-3">4-3-3</option><option value="4-2-3-1">4-2-3-1</option><option value="3-5-2">3-5-2</option><option value="3-4-3">3-4-3</option><option value="4-4-2">4-4-2</option>
          </select>
        </div>
        <div class="flex items-center justify-between text-[11px] text-slate-300">
          <span>شعار الفريق الأول:</span>
          <input type="file" accept="image/*" onchange="handleLogoUpload('red',event)" class="text-[10px] w-48">
        </div>
        <div id="red-players-list" class="space-y-1 max-h-56 overflow-y-auto pr-1"></div>
      </div>
      <div class="bg-slate-900 border border-slate-800 p-3 rounded-xl space-y-2">
        <div class="grid grid-cols-2 gap-2">
          <input id="input-blue-team-name" value="الفريق الثاني" class="bg-slate-950 border border-slate-700 rounded px-2 py-1 text-xs text-white">
          <select id="select-blue-formation" onchange="populateLineupInputs('blue',this.value,false)" class="bg-slate-950 border border-slate-700 rounded px-2 py-1 text-xs text-white">
            <option value="4-3-3">4-3-3</option><option value="4-2-3-1">4-2-3-1</option><option value="5-4-1">5-4-1</option><option value="3-5-2">3-5-2</option><option value="3-4-3">3-4-3</option><option value="4-4-2">4-4-2</option>
          </select>
        </div>
        <div class="flex items-center justify-between text-[11px] text-slate-300">
          <span>شعار الفريق الثاني:</span>
          <input type="file" accept="image/*" onchange="handleLogoUpload('blue',event)" class="text-[10px] w-48">
        </div>
        <div id="blue-players-list" class="space-y-1 max-h-56 overflow-y-auto pr-1"></div>
      </div>
    </div>
    <div class="flex justify-end gap-2 px-4 py-2.5 border-t border-slate-800">
      <button onclick="closeLineupModal()" class="bg-slate-800 text-slate-300 text-xs px-4 py-1.5 rounded-lg">إلغاء</button>
      <button onclick="applyBothTeamsLineups()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-5 py-1.5 rounded-lg">حفظ وتطبيق</button>
    </div>
  </div>
</div>

// تحويل الإحداثيات لدعم وضع 3D Perspective
function normToCanvas(nx, ny) {
  if (!is3D) {
    return { x: pitchRect.x + nx * pitchRect.w, y: pitchRect.y + ny * pitchRect.h };
  }
  const topScale = 0.72;
  const botScale = 1.0;
  const scale = topScale + ny * (botScale - topScale);
  const cx = pitchRect.x + pitchRect.w / 2;
  const x = cx + (nx - 0.5) * pitchRect.w * scale;
  const y = pitchRect.y + pitchRect.h * 0.14 + Math.pow(ny, 1.12) * (pitchRect.h * 0.82);
  return { x, y, scale };
}

function canvasToNorm(cx, cy) {
  if (!is3D) {
    return {
      nx: Math.max(0, Math.min(1, (cx - pitchRect.x) / pitchRect.w)),
      ny: Math.max(0, Math.min(1, (cy - pitchRect.y) / pitchRect.h))
    };
  }
  const yNormRaw = Math.max(0, Math.min(1, (cy - (pitchRect.y + pitchRect.h * 0.14)) / (pitchRect.h * 0.82)));
  const ny = Math.pow(yNormRaw, 1 / 1.12);
  const scale = 0.72 + ny * 0.28;
  const centerX = pitchRect.x + pitchRect.w / 2;
  const nx = Math.max(0, Math.min(1, 0.5 + (cx - centerX) / (pitchRect.w * scale)));
  return { nx, ny };
}

function togglePlayAnimation(cb){

  syncCurrentFrame();isPlaying=true;document.getElementById("play-label").textContent="⏹ إيقاف";

  function step(now){
    if(!isPlaying)return;
    const dur=parseInt(document.getElementById("anim-speed").value)||900;
    const t=Math.min(1,(now-st)/dur),ease=t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
    const fA=keyframes[seg],fB=keyframes[seg+1];
    pieces=fB.pieces.map(pb=>{const pa=fA.pieces.find(x=>x.id===pb.id)||pb;return{...pb,nx:pa.nx+(pb.nx-pa.nx)*ease,ny:pa.ny+(pb.ny-pa.ny)*ease};});
    drawings=fA.drawings;links=fA.links||[];currentFrameIdx=seg;loadFrameNotesToUI();renderFramesBar();render();
    if(t<1)animRaf=requestAnimationFrame(step);
    else{seg++;if(seg<keyframes.length-1){st=performance.now();animRaf=requestAnimationFrame(step);}else if(isLooping&&!cb){seg=0;st=performance.now();animRaf=requestAnimationFrame(step);}else{selectKeyframe(keyframes.length-1);if(cb)cb();}}
  }
  animRaf=requestAnimationFrame(step);
}
