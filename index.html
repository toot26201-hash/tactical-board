<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700&family=Inter:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  body { font-family: "Cairo", "Inter", sans-serif; background: #0b0f19; color: #e2e8f0; margin: 0; padding: 0; overflow: hidden; user-select: none; }
  .font-en { font-family: "Inter", sans-serif; }
  .tool-btn.active { background: #2563eb; color: #fff; border-color: #60a5fa; }
  .toggle-pill.active { background: #1e293b; border-color: #38bdf8; color: #38bdf8; }
  .frame-btn.active { background: #10b981; color: #fff; border-color: #34d399; }
  canvas { touch-action: none; display: block; margin: 0 auto; }
</style>
</head>
<body class="w-screen h-screen flex flex-col bg-[#0b0f19]">
<header class="bg-[#111827] border-b border-slate-800 px-3 py-2 flex flex-wrap items-center justify-between gap-1.5 shrink-0">
  <span class="text-sm font-bold text-white">⚽ ProTactics <span class="text-[10px] text-amber-300 bg-amber-950 border border-amber-700 px-1.5 py-0.5 rounded-full">Studio</span></span>
  <div class="flex flex-wrap items-center gap-1">
    <button onclick="openLineupModal()" class="bg-blue-600 hover:bg-blue-500 text-white text-[11px] px-2.5 py-1 rounded-lg font-bold">الأندية والتشكيلة</button>
    <select onchange="loadSetPiece(this.value);this.value='';" class="bg-slate-900 border border-slate-700 text-amber-300 text-[11px] px-2 py-1 rounded-lg font-semibold">
      <option value="">⚡ قوالب جاهزة</option>
      <option value="corner_att">ركنية هجومية</option>
      <option value="fk_direct">ركلة حرة وحائط صد</option>
      <option value="gk_buildup">بناء لعب من المرمى</option>
      <option value="high_press">ضغط عالي (4-3-3 vs 4-2-3-1)</option>
      <option value="counter_att">تحول هجومي سريع</option>
      <option value="rondo_drill">تدريب رندو وتحول (Rondo + Mini-Goals)</option>
    </select>
    <div class="flex bg-slate-900 p-0.5 rounded-lg border border-slate-800">
      <button onclick="setPitchMode('full')" id="btn-pitch-full" class="pitch-mode-btn bg-slate-700 text-white text-[11px] px-2 py-0.5 rounded font-semibold">ملعب كامل</button>
      <button onclick="setPitchMode('half')" id="btn-pitch-half" class="pitch-mode-btn text-slate-400 text-[11px] px-2 py-0.5 rounded font-semibold">نصف ملعب</button>
    </div>
    <button onclick="toggleZones()" id="btn-toggle-zones" class="toggle-pill bg-slate-900 text-slate-300 border border-slate-700 text-[11px] px-2 py-1 rounded-lg font-semibold">5-Zones</button>
    <button onclick="toggleOffside()" id="btn-toggle-offside" class="toggle-pill bg-slate-900 text-slate-300 border border-slate-700 text-[11px] px-2 py-1 rounded-lg font-semibold">التسلل</button>
    <button onclick="toggleCompactness()" id="btn-toggle-compact" class="toggle-pill bg-slate-900 text-slate-300 border border-slate-700 text-[11px] px-2 py-1 rounded-lg font-semibold">التماسك</button>
    <button onclick="toggleNotesPanel()" id="btn-toggle-notes" class="toggle-pill bg-slate-900 text-slate-300 border border-slate-700 text-[11px] px-2 py-1 rounded-lg font-semibold">الملاحظات</button>
    <select id="pitch-theme-select" onchange="setPitchTheme(this.value)" class="bg-slate-900 border border-slate-700 text-slate-200 text-[11px] px-1.5 py-1 rounded-lg">
      <option value="green">أخضر عشبي</option>
      <option value="classic">أخضر فاتح</option>
      <option value="navy">كحلي تكتيكي</option>
      <option value="midnight">أسود ليلي</option>
      <option value="opta">أبيض Opta</option>
    </select>
  </div>
  <div class="flex items-center gap-1">
    <button onclick="exportJSON()" title="حفظ" class="bg-slate-800 text-sky-300 border border-slate-700 text-[11px] px-2 py-1 rounded-lg"><i class="fa-solid fa-floppy-disk"></i></button>
    <label title="فتح" class="bg-slate-800 text-purple-300 border border-slate-700 text-[11px] px-2 py-1 rounded-lg cursor-pointer"><i class="fa-solid fa-folder-open"></i><input type="file" accept=".json" onchange="importJSON(event)" class="hidden"></label>
    <button onclick="undoAction()" title="تراجع" class="bg-slate-800 text-slate-200 border border-slate-700 text-[11px] px-2 py-1 rounded-lg"><i class="fa-solid fa-rotate-left"></i></button>
    <button onclick="clearDrawings()" title="مسح الرسم" class="bg-slate-800 text-amber-300 border border-slate-700 text-[11px] px-2 py-1 rounded-lg"><i class="fa-solid fa-eraser"></i></button>
    <button onclick="resetBoard()" title="إعادة ضبط" class="bg-slate-800 text-red-400 border border-slate-700 text-[11px] px-2 py-1 rounded-lg"><i class="fa-solid fa-trash-can"></i></button>
    <button onclick="exportPNG()" class="bg-emerald-600 text-white font-bold text-[11px] px-2 py-1 rounded-lg">PNG</button>
    <button onclick="exportVideo()" id="btn-export-video" class="bg-rose-600 text-white font-bold text-[11px] px-2 py-1 rounded-lg">فيديو</button>
  </div>
</header>

<div class="flex-1 flex overflow-hidden" style="height: calc(100vh - 50px);">
  <aside class="bg-[#111827] border-l border-slate-800 p-2 flex flex-col gap-1.5 w-48 shrink-0 overflow-y-auto">
    <div class="grid grid-cols-2 gap-1">
      <button onclick="setTool('select')" id="tool-select" class="tool-btn active p-1.5 rounded border border-slate-700 bg-slate-800 text-[11px]">تحريك</button>
      <button onclick="setTool('spotlight')" id="tool-spotlight" class="tool-btn p-1.5 rounded border border-slate-700 bg-slate-800 text-[11px] text-amber-300">✨ تمييز لاعب</button>
      <button onclick="setTool('arrow')" id="tool-arrow" class="tool-btn p-1.5 rounded border border-slate-700 bg-slate-800 text-[11px]">سهم حركة</button>
      <button onclick="setTool('curved')" id="tool-curved" class="tool-btn p-1.5 rounded border border-slate-700 bg-slate-800 text-[11px]">ضغط قوسي</button>
      <button onclick="setTool('pass')" id="tool-pass" class="tool-btn p-1.5 rounded border border-slate-700 bg-slate-800 text-[11px]">تمرير</button>
      <button onclick="setTool('shadow')" id="tool-shadow" class="tool-btn p-1.5 rounded border border-slate-700 bg-slate-800 text-[11px] text-rose-300">ظل دفاعي</button>
      <button onclick="setTool('vision')" id="tool-vision" class="tool-btn p-1.5 rounded border border-slate-700 bg-slate-800 text-[11px] text-cyan-300">مخروط رؤية</button>
      <button onclick="setTool('polygon')" id="tool-polygon" class="tool-btn p-1.5 rounded border border-slate-700 bg-slate-800 text-[11px]">تظليل مساحة</button>
      <button onclick="setTool('ruler')" id="tool-ruler" class="tool-btn p-1.5 rounded border border-slate-700 bg-slate-800 text-[11px]">قياس متر</button>
      <button onclick="setTool('text')" id="tool-text" class="tool-btn p-1.5 rounded border border-slate-700 bg-slate-800 text-[11px]">نص شرح</button>
    </div>
    <div class="flex items-center justify-around bg-slate-900 p-1.5 rounded border border-slate-800">
      <button onclick="setColor('#facc15')" data-color="#facc15" class="color-btn w-4 h-4 rounded-full bg-yellow-400 ring-2 ring-white"></button>
      <button onclick="setColor('#ffffff')" data-color="#ffffff" class="color-btn w-4 h-4 rounded-full bg-white"></button>
      <button onclick="setColor('#ef4444')" data-color="#ef4444" class="color-btn w-4 h-4 rounded-full bg-red-500"></button>
      <button onclick="setColor('#38bdf8')" data-color="#38bdf8" class="color-btn w-4 h-4 rounded-full bg-sky-400"></button>
      <button onclick="setColor('#f97316')" data-color="#f97316" class="color-btn w-4 h-4 rounded-full bg-orange-500"></button>
    </div>
    <div class="text-[10px] font-bold text-slate-400 mt-1">اللاعبون وأدوات التدريب</div>
    <div class="grid grid-cols-2 gap-1">
      <button onclick="addPiece('red')" class="bg-red-950 text-red-300 border border-red-800 py-1 rounded text-[11px]">+ لاعب 1</button>
      <button onclick="addPiece('blue')" class="bg-sky-950 text-sky-300 border border-sky-800 py-1 rounded text-[11px]">+ لاعب 2</button>
      <button onclick="addPiece('ball')" class="bg-slate-800 text-slate-200 border border-slate-700 py-1 rounded text-[11px]">+ كرة</button>
      <button onclick="addPiece('cone')" class="bg-amber-950 text-amber-300 border border-amber-800 py-1 rounded text-[11px]">+ قمع</button>
      <button onclick="addPiece('mannequin')" class="bg-purple-950 text-purple-300 border border-purple-800 py-1 rounded text-[11px]">+ دمية</button>
      <button onclick="addPiece('minigoal')" class="bg-emerald-950 text-emerald-300 border border-emerald-800 py-1 rounded text-[11px]">+ مرمى صغير</button>
      <button onclick="addPiece('hurdle')" class="bg-cyan-950 text-cyan-300 border border-cyan-800 py-1 rounded text-[11px]">+ حاجز قفز</button>
      <button onclick="addPiece('ladder')" class="bg-yellow-950 text-yellow-300 border border-yellow-800 py-1 rounded text-[11px]">+ سلم سرعة</button>
    </div>
  </aside>

  <main id="canvas-container" class="flex-1 relative bg-[#080c14] flex flex-col items-center justify-between p-2 overflow-hidden">
    <div class="w-full max-w-5xl flex items-center justify-between bg-slate-900 border border-slate-800 rounded-lg px-3 py-1 shrink-0">
      <div class="flex items-center gap-2">
        <img id="banner-red-logo" src="" class="hidden w-5 h-5 object-contain rounded">
        <span id="badge-red-color" class="w-2.5 h-2.5 rounded-full bg-red-600 inline-block"></span>
        <span id="display-red-name" class="text-xs font-bold text-white">الفريق الأول</span>
        <span id="display-red-form" class="text-[10px] font-en bg-slate-800 text-slate-300 px-1.5 py-0.5 rounded">5-4-1</span>
        <span id="metrics-red" class="hidden text-[10px] font-en bg-red-950 border border-red-800 text-red-200 px-2 py-0.5 rounded"></span>
      </div>
      <span class="text-[11px] font-en font-bold text-slate-500">VS</span>
      <div class="flex items-center gap-2">
        <span id="metrics-blue" class="hidden text-[10px] font-en bg-sky-950 border border-sky-800 text-sky-200 px-2 py-0.5 rounded"></span>
        <span id="display-blue-form" class="text-[10px] font-en bg-slate-800 text-slate-300 px-1.5 py-0.5 rounded">4-3-3</span>
        <span id="display-blue-name" class="text-xs font-bold text-white">الفريق الثاني</span>
        <span id="badge-blue-color" class="w-2.5 h-2.5 rounded-full bg-sky-600 inline-block"></span>
        <img id="banner-blue-logo" src="" class="hidden w-5 h-5 object-contain rounded">
      </div>
    </div>
    
    <div id="pitch-wrapper" class="w-full flex-1 flex items-center justify-center overflow-hidden my-1">
      <canvas id="tactical-canvas" class="rounded-xl shadow-2xl border border-slate-800"></canvas>
    </div>

    <div class="w-full max-w-5xl bg-slate-900 border border-slate-800 rounded-xl px-3 py-1.5 flex items-center justify-between gap-2 shrink-0">
      <div class="flex items-center gap-1.5">
        <button onclick="togglePlayAnimation()" id="btn-play-anim" class="bg-emerald-600 text-white text-xs font-bold px-3 py-1 rounded-lg"><span id="play-label">▶ تشغيل</span></button>
        <button onclick="addKeyframe()" class="bg-blue-600 text-white text-xs font-semibold px-2.5 py-1 rounded-lg">+ إطار</button>
        <button onclick="deleteCurrentKeyframe()" class="bg-slate-800 text-red-400 text-xs px-2 py-1 rounded-lg">حذف</button>
      </div>
      <div id="frames-list" class="flex items-center gap-1 overflow-x-auto"></div>
      <select id="anim-speed" class="bg-slate-950 border border-slate-700 rounded px-1.5 py-0.5 text-xs text-white">
        <option value="1400">بطيء</option>
        <option value="900" selected>متوسط</option>
        <option value="500">سريع</option>
      </select>
    </div>
    <div id="polygon-controls" class="hidden absolute bottom-16 left-1/2 -translate-x-1/2 bg-slate-900 border border-yellow-500 px-4 py-1.5 rounded-full flex items-center gap-2 z-30">
      <button onclick="finishPolygon()" class="bg-emerald-600 text-white text-xs font-bold px-3 py-1 rounded-full">إغلاق وتظليل</button>
      <button onclick="cancelPolygon()" class="bg-slate-700 text-slate-200 text-xs px-2.5 py-1 rounded-full">إلغاء</button>
    </div>
    <div id="toast-msg" class="pointer-events-none opacity-0 transition-opacity duration-300 absolute top-12 left-1/2 -translate-x-1/2 bg-slate-900 border border-slate-700 text-white text-xs px-4 py-1.5 rounded-full z-40"></div>
  </main>

  <aside id="notes-panel" class="hidden bg-[#111827] border-r border-slate-800 p-3 flex flex-col gap-2 w-60 shrink-0">
    <div class="flex justify-between border-b border-slate-800 pb-1">
      <span class="text-xs font-bold text-sky-400">ملاحظات الإطار</span>
      <button onclick="toggleNotesPanel()" class="text-slate-400 text-xs">✕</button>
    </div>
    <input type="text" id="frame-title-input" oninput="updateFrameNotes()" placeholder="عنوان اللقطة..." class="bg-slate-950 border border-slate-700 rounded px-2 py-1 text-xs text-white">
    <textarea id="frame-notes-input" oninput="updateFrameNotes()" placeholder="اكتب الشرح التكتيكي هنا..." class="bg-slate-950 border border-slate-700 rounded p-2 text-xs text-slate-200 flex-1 resize-none"></textarea>
    <label class="flex items-center gap-1.5 text-[11px] text-slate-300"><input type="checkbox" id="show-note-overlay" checked onchange="render()"> عرض العنوان على الملعب</label>
  </aside>
</div>

<div id="lineup-modal" class="hidden fixed inset-0 bg-black/75 flex items-center justify-center z-50 p-3">
  <div class="bg-[#111827] border border-slate-700 rounded-2xl w-full max-w-3xl max-h-[90vh] flex flex-col">
    <div class="flex justify-between border-b border-slate-800 px-4 py-2.5">
      <h3 class="text-sm font-bold text-white">الأندية والتشكيلة</h3>
      <button onclick="closeLineupModal()" class="text-slate-400">✕</button>
    </div>
    <div class="p-3 overflow-y-auto grid grid-cols-2 gap-3">
      <div class="bg-slate-900 p-2.5 rounded-xl">
        <div class="grid grid-cols-2 gap-1.5 mb-2">
          <input id="input-red-team-name" value="الفريق الأول" class="bg-slate-950 border border-slate-700 rounded px-2 py-1 text-xs text-white">
          <select id="select-red-formation" onchange="populateLineupInputs('red',this.value)" class="bg-slate-950 border border-slate-700 rounded px-2 py-1 text-xs text-white">
            <option value="5-4-1">5-4-1</option><option value="4-3-3">4-3-3</option><option value="3-5-2">3-5-2</option><option value="4-2-3-1">4-2-3-1</option><option value="4-4-2">4-4-2</option>
          </select>
        </div>
        <div class="flex items-center gap-2 mb-2 text-xs">
          <input type="file" accept="image/*" onchange="handleLogoUpload('red',event)" class="text-[11px]">
          <input type="color" id="red-kit-primary" value="#dc2626">
          <input type="color" id="red-kit-secondary" value="#dc2626">
          <label><input type="checkbox" id="red-kit-striped"> مخطط</label>
        </div>
        <div id="red-players-list" class="space-y-1 max-h-48 overflow-y-auto"></div>
      </div>
      <div class="bg-slate-900 p-2.5 rounded-xl">
        <div class="grid grid-cols-2 gap-1.5 mb-2">
          <input id="input-blue-team-name" value="الفريق الثاني" class="bg-slate-950 border border-slate-700 rounded px-2 py-1 text-xs text-white">
          <select id="select-blue-formation" onchange="populateLineupInputs('blue',this.value)" class="bg-slate-950 border border-slate-700 rounded px-2 py-1 text-xs text-white">
            <option value="4-3-3">4-3-3</option><option value="4-2-3-1">4-2-3-1</option><option value="5-4-1">5-4-1</option><option value="3-5-2">3-5-2</option><option value="4-4-2">4-4-2</option>
          </select>
        </div>
        <div class="flex items-center gap-2 mb-2 text-xs">
          <input type="file" accept="image/*" onchange="handleLogoUpload('blue',event)" class="text-[11px]">
          <input type="color" id="blue-kit-primary" value="#0284c7">
          <input type="color" id="blue-kit-secondary" value="#ffffff">
          <label><input type="checkbox" id="blue-kit-striped"> مخطط</label>
        </div>
        <div id="blue-players-list" class="space-y-1 max-h-48 overflow-y-auto"></div>
      </div>
    </div>
    <div class="flex justify-end gap-2 px-4 py-2 border-t border-slate-800">
      <button onclick="closeLineupModal()" class="bg-slate-800 text-xs px-3 py-1 rounded">إلغاء</button>
      <button onclick="applyBothTeamsLineups()" class="bg-emerald-600 text-white text-xs font-bold px-4 py-1 rounded">تطبيق</button>
    </div>
  </div>
</div>

<div id="edit-modal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50">
  <div class="bg-[#111827] border border-slate-700 rounded-xl w-72 p-4">
    <input id="edit-number" class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-xs text-white mb-2" placeholder="الرقم">
    <input id="edit-label" class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-xs text-white mb-2" placeholder="الاسم">
    <label class="flex items-center gap-1.5 text-xs text-amber-300 mb-3"><input type="checkbox" id="edit-spotlight"> حلقة تمييز نبضية (Spotlight Pulse)</label>
    <div class="flex justify-between">
      <button onclick="deleteSelectedPiece()" class="bg-red-900 text-xs px-2.5 py-1 rounded">حذف</button>
      <div class="flex gap-1">
        <button onclick="closeEditModal()" class="bg-slate-800 text-xs px-2.5 py-1 rounded">إلغاء</button>
        <button onclick="saveEditModal()" class="bg-blue-600 text-xs font-bold px-3 py-1 rounded">حفظ</button>
      </div>
    </div>
  </div>
</div>

<div id="text-modal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50">
  <div class="bg-[#111827] border border-slate-700 rounded-xl w-72 p-4">
    <input id="annotation-input" class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-xs text-white mb-3" placeholder="اكتب النص...">
    <div class="flex justify-end gap-1">
      <button onclick="closeTextModal()" class="bg-slate-800 text-xs px-2.5 py-1 rounded">إلغاء</button>
      <button onclick="confirmTextAnnotation()" class="bg-blue-600 text-xs font-bold px-3 py-1 rounded">إضافة</button>
    </div>
  </div>
</div>

<script>
const canvas=document.getElementById("tactical-canvas"),ctx=canvas.getContext("2d"),container=document.getElementById("canvas-container");
let pitchMode="full",showZones=false,showOffside=false,offsideNx=0.72,showCompactness=false,draggingOffside=false,pitchTheme="green",currentTool="select",currentColor="#facc15",currentStrokeWidth=3,pitchRect={x:0,y:0,w:0,h:0};
let redTeamMeta={name:"الفريق الأول",formation:"5-4-1",primary:"#dc2626",secondary:"#dc2626",striped:false,logoData:null},blueTeamMeta={name:"الفريق الثاني",formation:"4-3-3",primary:"#0284c7",secondary:"#ffffff",striped:false,logoData:null};
let redLogoImg=null,blueLogoImg=null,tempRedLogo=null,tempBlueLogo=null,pieces=[],drawings=[],historyStack=[],keyframes=[],currentFrameIdx=0,isPlaying=false,animRaf=null,isRecordingVideo=false,draggingPiece=null,dragOffset={x:0,y:0},isDrawing=false,currentDraft=null,polygonPoints=[],editingPieceId=null,pendingTextPos=null;

function resizeCanvas(){
  const w=document.getElementById("pitch-wrapper");
  const rect=w.getBoundingClientRect();
  const aW=Math.max(450, rect.width - 20);
  const aH=Math.max(300, rect.height - 10);
  const tr=pitchMode==="full"?(105/68):(68/52.5);
  let fW=aW, fH=aW/tr;
  if(fH > aH){ fH = aH; fW = aH * tr; }
  const dpr=window.devicePixelRatio||1;
  canvas.width=Math.round(fW*dpr);
  canvas.height=Math.round(fH*dpr);
  canvas.style.width=Math.round(fW)+"px";
  canvas.style.height=Math.round(fH)+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const m=Math.max(10,Math.min(fW,fH)*0.025);
  pitchRect={x:m,y:m,w:fW-m*2,h:fH-m*2,canvasW:fW,canvasH:fH};
  render();
}

const normToCanvas=(nx,ny)=>({x:pitchRect.x+nx*pitchRect.w,y:pitchRect.y+ny*pitchRect.h}),canvasToNorm=(cx,cy)=>({nx:Math.max(0,Math.min(1,(cx-pitchRect.x)/pitchRect.w)),ny:Math.max(0,Math.min(1,(cy-pitchRect.y)/pitchRect.h))}),calculateMeters=(p1,p2)=>Math.hypot((p2.nx-p1.nx)*(pitchMode==="full"?105:52.5),(p2.ny-p1.ny)*68).toFixed(1);

function drawPitch(){const{x,y,w,h,canvasW,canvasH}=pitchRect;if(w<=0||h<=0)return;const th=pitchThemes[pitchTheme]||pitchThemes.green;ctx.fillStyle=th.outer;ctx.fillRect(0,0,canvasW,canvasH);ctx.fillStyle=th.inner;ctx.fillRect(x,y,w,h);if(th.stripes){const s=pitchMode==="full"?14:8,sw=w/s;for(let i=0;i<s;i+=2){ctx.fillStyle=th.stripeColor;ctx.fillRect(x+i*sw,y,sw,h);}}if(showZones){const penH=(40.32/68)*h,goalH=(18.32/68)*h,topW=(h-penH)/2,hsH=(penH-goalH)/2,y1=y+topW,y2=y1+hsH,y3=y2+goalH,y4=y3+hsH;ctx.fillStyle="rgba(250,204,21,0.08)";ctx.fillRect(x,y1,w,hsH);ctx.fillRect(x,y3,w,hsH);ctx.save();ctx.strokeStyle="rgba(250,204,21,0.42)";ctx.setLineDash([6,6]);ctx.lineWidth=1.2;[y1,y2,y3,y4].forEach(ly=>{ctx.beginPath();ctx.moveTo(x,ly);ctx.lineTo(x+w,ly);ctx.stroke();});ctx.strokeStyle="rgba(56,189,248,0.4)";[x+w/3,x+(2*w)/3].forEach(lx=>{ctx.beginPath();ctx.moveTo(lx,y);ctx.lineTo(lx,y+h);ctx.stroke();});ctx.restore();}ctx.strokeStyle=th.lines;ctx.lineWidth=2;ctx.strokeRect(x,y,w,h);const len=pitchMode==="full"?105:52.5,cR=Math.max(1,(9.15/len)*w),penW=(16.5/len)*w,penH=(40.32/68)*h,penY=y+(h-penH)/2,goalW=(5.5/len)*w,goalH=(18.32/68)*h,goalY=y+(h-goalH)/2,spot=(11/len)*w,netH=(7.32/68)*h;ctx.strokeRect(x,penY,penW,penH);ctx.strokeRect(x,goalY,goalW,goalH);ctx.fillStyle=th.lines;ctx.beginPath();ctx.arc(x+spot,y+h/2,2.5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(x+spot,y+h/2,cR,-0.92,0.92);ctx.stroke();ctx.strokeRect(x-6,y+(h-netH)/2,6,netH);if(pitchMode==="full"){ctx.beginPath();ctx.moveTo(x+w/2,y);ctx.lineTo(x+w/2,y+h);ctx.stroke();ctx.beginPath();ctx.arc(x+w/2,y+h/2,cR,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(x+w/2,y+h/2,3,0,Math.PI*2);ctx.fill();ctx.strokeRect(x+w-penW,penY,penW,penH);ctx.strokeRect(x+w-goalW,goalY,goalW,goalH);ctx.beginPath();ctx.arc(x+w-spot,y+h/2,2.5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(x+w-spot,y+h/2,cR,Math.PI-0.92,Math.PI+0.92);ctx.stroke();ctx.strokeRect(x+w,y+(h-netH)/2,6,netH);}else{ctx.beginPath();ctx.arc(x+w,y+h/2,cR,Math.PI*0.5,Math.PI*1.5);ctx.stroke();}const ls=Math.max(26,Math.min(44,w*0.048));if(redLogoImg)ctx.drawImage(redLogoImg,x+12,y+12,ls,ls);if(blueLogoImg)ctx.drawImage(blueLogoImg,x+w-ls-12,y+12,ls,ls);if(showOffside){const ox=x+offsideNx*w;ctx.save();ctx.strokeStyle="#f43f5e";ctx.setLineDash([7,5]);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(ox,y);ctx.lineTo(ox,y+h);ctx.stroke();ctx.restore();}const kfTitle=keyframes[currentFrameIdx]?.title;if(document.getElementById("show-note-overlay")?.checked&&kfTitle){ctx.save();ctx.font="bold 12px Cairo,sans-serif";const tw=ctx.measureText(kfTitle).width+24,bx=x+(w-tw)/2,by=y+8;ctx.fillStyle="rgba(15,23,42,0.88)";ctx.strokeStyle="#38bdf8";ctx.fillRect(bx,by,tw,24);ctx.strokeRect(bx,by,tw,24);ctx.fillStyle="#f8fafc";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(kfTitle,x+w/2,by+12);ctx.restore();}}
function renderDrawingItem(item){ctx.save();ctx.strokeStyle=item.color;ctx.fillStyle=item.color;ctx.lineWidth=item.width||3;ctx.lineCap="round";const p1=normToCanvas(item.points[0].nx,item.points[0].ny),p2=item.points[1]?normToCanvas(item.points[1].nx,item.points[1].ny):p1;if(item.type==="arrow"||item.type==="pass"){const hl=11+(item.width||3)*1.5,ang=Math.atan2(p2.y-p1.y,p2.x-p1.x);ctx.save();if(item.type==="pass")ctx.setLineDash([8,6]);ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x-Math.cos(ang)*hl*0.6,p2.y-Math.sin(ang)*hl*0.6);ctx.stroke();ctx.restore();ctx.beginPath();ctx.moveTo(p2.x,p2.y);ctx.lineTo(p2.x-hl*Math.cos(ang-0.52),p2.y-hl*Math.sin(ang-0.52));ctx.lineTo(p2.x-hl*Math.cos(ang+0.52),p2.y-hl*Math.sin(ang+0.52));ctx.closePath();ctx.fill();}else if(item.type==="curved"){const dx=p2.x-p1.x,dy=p2.y-p1.y,dist=Math.hypot(dx,dy);if(dist>5){const cpx=(p1.x+p2.x)/2+(-dy/dist)*(dist*0.28),cpy=(p1.y+p2.y)/2+(dx/dist)*(dist*0.28);ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.quadraticCurveTo(cpx,cpy,p2.x,p2.y);ctx.stroke();const ang=Math.atan2(p2.y-cpy,p2.x-cpx),hl=11+(item.width||3)*1.5;ctx.beginPath();ctx.moveTo(p2.x,p2.y);ctx.lineTo(p2.x-hl*Math.cos(ang-0.52),p2.y-hl*Math.sin(ang-0.52));ctx.lineTo(p2.x-hl*Math.cos(ang+0.52),p2.y-hl*Math.sin(ang+0.52));ctx.closePath();ctx.fill();}}else if(item.type==="shadow"){const ang=Math.atan2(p2.y-p1.y,p2.x-p1.x),dist=Math.max(45,Math.hypot(p2.x-p1.x,p2.y-p1.y)*2.4),g=ctx.createRadialGradient(p1.x,p1.y,5,p1.x,p1.y,dist);g.addColorStop(0,hexToRgba(item.color,0.42));g.addColorStop(1,hexToRgba(item.color,0.03));ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.arc(p1.x,p1.y,dist,ang-0.26,ang+0.26);ctx.closePath();ctx.fill();}else if(item.type==="vision"){const ang=Math.atan2(p2.y-p1.y,p2.x-p1.x),dist=Math.max(55,Math.hypot(p2.x-p1.x,p2.y-p1.y));ctx.fillStyle=hexToRgba(item.color,0.18);ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.arc(p1.x,p1.y,dist,ang-0.58,ang+0.58);ctx.closePath();ctx.fill();ctx.stroke();}else if(item.type==="polygon"){ctx.beginPath();item.points.forEach((pt,i)=>{const c=normToCanvas(pt.nx,pt.ny);i===0?ctx.moveTo(c.x,c.y):ctx.lineTo(c.x,c.y);});ctx.closePath();ctx.fillStyle=hexToRgba(item.color,0.24);ctx.fill();ctx.stroke();}else if(item.type==="ruler"){ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.stroke();const lbl=calculateMeters(item.points[0],item.points[1])+" m",mx=(p1.x+p2.x)/2,my=(p1.y+p2.y)/2;ctx.font="bold 12px Inter,sans-serif";const tw=ctx.measureText(lbl).width+12;ctx.fillStyle="#0f172a";ctx.fillRect(mx-tw/2,my-11,tw,22);ctx.strokeRect(mx-tw/2,my-11,tw,22);ctx.fillStyle=item.color;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(lbl,mx,my);}else if(item.type==="text"){ctx.font="bold 13px Cairo,sans-serif";const tw=ctx.measureText(item.text).width+16;ctx.fillStyle="rgba(15,23,42,0.9)";ctx.fillRect(p1.x-tw/2,p1.y-13,tw,26);ctx.strokeRect(p1.x-tw/2,p1.y-13,tw,26);ctx.fillStyle=item.color;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(item.text,p1.x,p1.y);}ctx.restore();}

function drawPieces(){
  const r=Math.max(13,Math.min(18,pitchRect.w*0.021));
  const pulseExpand=Math.sin(pulsePhase)*4.5;
  const pulseAlpha=0.22+Math.abs(Math.sin(pulsePhase))*0.22;

  pieces.forEach(p=>{
    const pos=normToCanvas(p.nx,p.ny);ctx.save();
    if(p.type==="red"||p.type==="blue"){
      if(p.spotlight){
        ctx.beginPath();ctx.arc(pos.x,pos.y,r+8+pulseExpand,0,Math.PI*2);
        ctx.fillStyle=`rgba(250,204,21,${pulseAlpha.toFixed(2)})`;ctx.fill();
        ctx.strokeStyle="#facc15";ctx.lineWidth=2;ctx.setLineDash([4,3]);ctx.stroke();ctx.setLineDash([]);
      }
      const meta=p.type==="red"?redTeamMeta:blueTeamMeta;
      ctx.beginPath();ctx.arc(pos.x,pos.y,r,0,Math.PI*2);ctx.clip();ctx.fillStyle=meta.primary;ctx.fillRect(pos.x-r,pos.y-r,r*2,r*2);
      if(meta.striped){ctx.fillStyle=meta.secondary;ctx.fillRect(pos.x-r*0.45,pos.y-r,r*0.35,r*2);ctx.fillRect(pos.x+r*0.15,pos.y-r,r*0.35,r*2);}
      ctx.restore();ctx.save();ctx.beginPath();ctx.arc(pos.x,pos.y,r,0,Math.PI*2);ctx.strokeStyle=pitchTheme==="opta"?"#0f172a":"#fff";ctx.lineWidth=2;ctx.stroke();
      ctx.font=`bold ${r*0.72}px Inter,sans-serif`;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillStyle="#fff";ctx.fillText(p.number||"",pos.x,pos.y);
      if(p.label){ctx.font="bold 10px Cairo,sans-serif";const lw=ctx.measureText(p.label).width+8;ctx.fillStyle="rgba(15,23,42,0.88)";ctx.fillRect(pos.x-lw/2,pos.y+r+3,lw,14);ctx.fillStyle="#f8fafc";ctx.fillText(p.label,pos.x,pos.y+r+10);}
    }else if(p.type==="ball"){
      ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(pos.x,pos.y,r*0.62,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#0f172a";ctx.lineWidth=2;ctx.stroke();
    }else if(p.type==="cone"){
      const cr=r*0.65;ctx.fillStyle="#f97316";ctx.beginPath();ctx.moveTo(pos.x,pos.y-cr);ctx.lineTo(pos.x+cr,pos.y+cr*0.8);ctx.lineTo(pos.x-cr,pos.y+cr*0.8);ctx.closePath();ctx.fill();ctx.strokeStyle="#fff";ctx.lineWidth=1;ctx.stroke();
    }else if(p.type==="mannequin"){
      ctx.fillStyle="#a855f7";ctx.strokeStyle="#fff";ctx.lineWidth=1.5;
      ctx.beginPath();ctx.arc(pos.x,pos.y-r*0.58,r*0.32,0,Math.PI*2);ctx.fill();ctx.stroke();
      ctx.fillRect(pos.x-r*0.36,pos.y-r*0.18,r*0.72,r*0.95);ctx.strokeRect(pos.x-r*0.36,pos.y-r*0.18,r*0.72,r*0.95);
    }else if(p.type==="minigoal"){
      ctx.fillStyle="rgba(16,185,129,0.2)";ctx.strokeStyle="#10b981";ctx.lineWidth=2.5;
      ctx.fillRect(pos.x-r*0.5,pos.y-r*1.1,r,r*2.2);ctx.strokeRect(pos.x-r*0.5,pos.y-r*1.1,r,r*2.2);
    }else if(p.type==="hurdle"){
      ctx.strokeStyle="#38bdf8";ctx.lineWidth=3;
      ctx.beginPath();ctx.moveTo(pos.x-r*0.8,pos.y-r*0.4);ctx.lineTo(pos.x+r*0.8,pos.y-r*0.4);
      ctx.moveTo(pos.x-r*0.6,pos.y-r*0.4);ctx.lineTo(pos.x-r*0.6,pos.y+r*0.5);
      ctx.moveTo(pos.x+r*0.6,pos.y-r*0.4);ctx.lineTo(pos.x+r*0.6,pos.y+r*0.5);ctx.stroke();
    }else if(p.type==="ladder"){
      const lw=r*0.85,lh=r*2.2;ctx.strokeStyle="#facc15";ctx.lineWidth=2;
      ctx.strokeRect(pos.x-lw/2,pos.y-lh/2,lw,lh);
      for(let k=1;k<=3;k++){const ry=pos.y-lh/2+(lh/4)*k;ctx.beginPath();ctx.moveTo(pos.x-lw/2,ry);ctx.lineTo(pos.x+lw/2,ry);ctx.stroke();}
    }
    ctx.restore();
  });
}

function render(){drawPitch();updateAndDrawCompactness();drawings.forEach(renderDrawingItem);if(currentDraft)renderDrawingItem(currentDraft);if(polygonPoints.length>0)renderDrawingItem({type:"polygon",points:polygonPoints,color:currentColor,width:currentStrokeWidth});drawPieces();}
function getPointerPos(e){const rect=canvas.getBoundingClientRect(),cx=e.touches?e.touches[0].clientX:e.clientX,cy=e.touches?e.touches[0].clientY:e.clientY;return{x:cx-rect.left,y:cy-rect.top};}
canvas.addEventListener("mousedown",e=>{const pos=getPointerPos(e),norm=canvasToNorm(pos.x,pos.y);if(showOffside&&Math.abs(pos.x-(pitchRect.x+offsideNx*pitchRect.w))<12){draggingOffside=true;return;}if(currentTool==="spotlight"){const hit=[...pieces].reverse().find(p=>{const c=normToCanvas(p.nx,p.ny);return Math.hypot(pos.x-c.x,pos.y-c.y)<=22;});if(hit&&(hit.type==="red"||hit.type==="blue")){saveHistory();hit.spotlight=!hit.spotlight;syncCurrentFrame();render();}return;}if(currentTool==="select"){const hit=[...pieces].reverse().find(p=>{const c=normToCanvas(p.nx,p.ny);return Math.hypot(pos.x-c.x,pos.y-c.y)<=22;});if(hit){saveHistory();draggingPiece=hit;const c=normToCanvas(hit.nx,hit.ny);dragOffset={x:pos.x-c.x,y:pos.y-c.y};}}else if(currentTool==="polygon"){polygonPoints.push(norm);document.getElementById("polygon-controls").classList.remove("hidden");render();}else if(currentTool==="text"){pendingTextPos=norm;document.getElementById("annotation-input").value="";document.getElementById("text-modal").classList.remove("hidden");}else{isDrawing=true;currentDraft={type:currentTool,points:[norm,norm],color:currentColor,width:currentStrokeWidth};}});
canvas.addEventListener("mousemove",e=>{if(draggingOffside){offsideNx=canvasToNorm(getPointerPos(e).x,0).nx;render();return;}if(draggingPiece){const pos=getPointerPos(e),n=canvasToNorm(pos.x-dragOffset.x,pos.y-dragOffset.y);draggingPiece.nx=n.nx;draggingPiece.ny=n.ny;render();}else if(isDrawing&&currentDraft){currentDraft.points[1]=canvasToNorm(getPointerPos(e).x,getPointerPos(e).y);render();}});
window.addEventListener("mouseup",()=>{if(draggingOffside){draggingOffside=false;return;}if(draggingPiece){draggingPiece=null;syncCurrentFrame();render();}else if(isDrawing&&currentDraft){isDrawing=false;if(Math.hypot(currentDraft.points[1].nx-currentDraft.points[0].nx,currentDraft.points[1].ny-currentDraft.points[0].ny)>0.015){saveHistory();drawings.push(currentDraft);syncCurrentFrame();}currentDraft=null;render();}});
canvas.addEventListener("dblclick",e=>{const pos=getPointerPos(e),hit=[...pieces].reverse().find(p=>{const c=normToCanvas(p.nx,p.ny);return Math.hypot(pos.x-c.x,pos.y-c.y)<=22;});if(hit){editingPieceId=hit.id;document.getElementById("edit-number").value=hit.number||"";document.getElementById("edit-label").value=hit.label||"";document.getElementById("edit-spotlight").checked=!!hit.spotlight;document.getElementById("edit-modal").classList.remove("hidden");}});
function exportJSON(){syncCurrentFrame();const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify({redTeamMeta,blueTeamMeta,pitchMode,keyframes})],{type:"application/json"}));a.download=`tactic_${Date.now()}.json`;a.click();}
function importJSON(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{const d=JSON.parse(ev.target.result);if(d.redTeamMeta){redTeamMeta=d.redTeamMeta;loadLogoImage("red",redTeamMeta.logoData);}if(d.blueTeamMeta){blueTeamMeta=d.blueTeamMeta;loadLogoImage("blue",blueTeamMeta.logoData);}if(d.keyframes?.length){keyframes=d.keyframes;currentFrameIdx=0;pieces=JSON.parse(JSON.stringify(keyframes[0].pieces));drawings=JSON.parse(JSON.stringify(keyframes[0].drawings));loadFrameNotesToUI();}updateTeamBanner();renderFramesBar();resizeCanvas();}catch{}};r.readAsText(f);}
function setTool(t){currentTool=t;document.querySelectorAll(".tool-btn").forEach(b=>b.classList.remove("active"));document.getElementById("tool-"+t)?.classList.add("active");}
function setColor(hex){currentColor=hex;document.querySelectorAll(".color-btn").forEach(b=>b.classList.toggle("ring-2",b.dataset.color===hex));}
function setPitchMode(m){pitchMode=m;document.querySelectorAll(".pitch-mode-btn").forEach(b=>b.classList.remove("bg-slate-700","text-white"));document.getElementById("btn-pitch-"+m).classList.add("bg-slate-700","text-white");resizeCanvas();}
function toggleZones(){showZones=!showZones;document.getElementById("btn-toggle-zones").classList.toggle("active",showZones);render();}
function toggleOffside(){showOffside=!showOffside;document.getElementById("btn-toggle-offside").classList.toggle("active",showOffside);render();}
function toggleCompactness(){showCompactness=!showCompactness;document.getElementById("btn-toggle-compact").classList.toggle("active",showCompactness);render();}
function saveHistory(){historyStack.push({pieces:JSON.parse(JSON.stringify(pieces)),drawings:JSON.parse(JSON.stringify(drawings))});if(historyStack.length>25)historyStack.shift();}
function undoAction(){if(!historyStack.length)return;const prev=historyStack.pop();pieces=prev.pieces;drawings=prev.drawings;syncCurrentFrame();render();}
function clearDrawings(){saveHistory();drawings=[];polygonPoints=[];syncCurrentFrame();render();}
function resetBoard(){saveHistory();drawings=[];initDefaultPieces();render();}
function addPiece(type){saveHistory();pieces.push({id:type+Date.now(),type,nx:0.5,ny:0.5,number:type==="red"||type==="blue"?"12":"",label:"",spotlight:false});syncCurrentFrame();render();}
function finishPolygon(){if(polygonPoints.length>=3){saveHistory();drawings.push({type:"polygon",points:[...polygonPoints],color:currentColor,width:currentStrokeWidth});syncCurrentFrame();}cancelPolygon();}
function cancelPolygon(){polygonPoints=[];document.getElementById("polygon-controls").classList.add("hidden");render();}
function closeTextModal(){document.getElementById("text-modal").classList.add("hidden");}
function confirmTextAnnotation(){const v=document.getElementById("annotation-input").value.trim();if(v&&pendingTextPos){saveHistory();drawings.push({type:"text",points:[pendingTextPos],color:currentColor,text:v});syncCurrentFrame();render();}closeTextModal();}
function closeEditModal(){document.getElementById("edit-modal").classList.add("hidden");}
function saveEditModal(){const p=pieces.find(x=>x.id===editingPieceId);if(p){saveHistory();p.number=document.getElementById("edit-number").value;p.label=document.getElementById("edit-label").value;p.spotlight=document.getElementById("edit-spotlight").checked;syncCurrentFrame();render();}closeEditModal();}
function deleteSelectedPiece(){saveHistory();pieces=pieces.filter(x=>x.id!==editingPieceId);syncCurrentFrame();closeEditModal();render();}
function openLineupModal(){populateLineupInputs("red",redTeamMeta.formation,true);populateLineupInputs("blue",blueTeamMeta.formation,true);document.getElementById("lineup-modal").classList.remove("hidden");}
function closeLineupModal(){document.getElementById("lineup-modal").classList.add("hidden");}
function populateLineupInputs(team,form,keep){const el=document.getElementById(team+"-players-list"),tpl=formationTemplates[form],cur=pieces.filter(p=>p.type===team);el.innerHTML="";tpl.forEach((s,i)=>{const num=keep&&cur[i]?cur[i].number:s.num,lbl=keep&&cur[i]?cur[i].label:s.label;el.innerHTML+=`<div class="flex gap-1"><input data-team="${team}" data-idx="${i}" data-f="num" value="${num}" class="w-10 bg-slate-950 border border-slate-700 rounded px-1 py-0.5 text-xs text-center text-white"><input data-team="${team}" data-idx="${i}" data-f="lbl" value="${lbl}" class="flex-1 bg-slate-950 border border-slate-700 rounded px-1.5 py-0.5 text-xs text-white"></div>`;});}
function applyBothTeamsLineups(){saveHistory();redTeamMeta={name:document.getElementById("input-red-team-name").value||"الفريق الأول",formation:document.getElementById("select-red-formation").value,primary:document.getElementById("red-kit-primary").value,secondary:document.getElementById("red-kit-secondary").value,striped:document.getElementById("red-kit-striped").checked,logoData:tempRedLogo};blueTeamMeta={name:document.getElementById("input-blue-team-name").value||"الفريق الثاني",formation:document.getElementById("select-blue-formation").value,primary:document.getElementById("blue-kit-primary").value,secondary:document.getElementById("blue-kit-secondary").value,striped:document.getElementById("blue-kit-striped").checked,logoData:tempBlueLogo};loadLogoImage("red",redTeamMeta.logoData);loadLogoImage("blue",blueTeamMeta.logoData);pieces=pieces.filter(p=>p.type!=="red"&&p.type!=="blue");formationTemplates[redTeamMeta.formation].forEach((s,i)=>pieces.push({id:"red_"+i,type:"red",nx:s.nx,ny:s.ny,number:document.querySelector(`input[data-team="red"][data-idx="${i}"][data-f="num"]`).value,label:document.querySelector(`input[data-team="red"][data-idx="${i}"][data-f="lbl"]`).value,spotlight:false}));formationTemplates[blueTeamMeta.formation].forEach((s,i)=>pieces.push({id:"blue_"+i,type:"blue",nx:1-s.nx,ny:s.ny,number:document.querySelector(`input[data-team="blue"][data-idx="${i}"][data-f="num"]`).value,label:document.querySelector(`input[data-team="blue"][data-idx="${i}"][data-f="lbl"]`).value,spotlight:false}));updateTeamBanner();syncCurrentFrame();closeLineupModal();render();}
function exportPNG(){const a=document.createElement("a");a.download=`tactic_${Date.now()}.png`;a.href=canvas.toDataURL("image/png",1.0);a.click();}
function hexToRgba(hex,a){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return`rgba(${r},${g},${b},${a})`;}
let toastTimer=null;function showToast(m){const el=document.getElementById("toast-msg");el.textContent=m;el.classList.remove("opacity-0");clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add("opacity-0"),2000);}

setInterval(()=>{if(pieces.some(p=>p.spotlight)&&!isPlaying){pulsePhase+=0.25;render();}},60);

window.addEventListener("resize",resizeCanvas);
initDefaultPieces();
setTimeout(resizeCanvas, 100);
setTimeout(resizeCanvas, 400);
</script>
