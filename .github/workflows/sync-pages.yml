name: Sync Streamlit HTML to GitHub Pages

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate updated index.html from app.py
        run: |
          python -c '
          with open("app.py", "r", encoding="utf-8") as f:
              code = f.read().split("components.html")[0]
          ns = {}
          exec(code, ns)
          if "html_code" in ns:
              with open("index.html", "w", encoding="utf-8") as out:
                  out.write(ns["html_code"])
          '
      - name: Commit updated index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-sync index.html from app.py" && git push)
